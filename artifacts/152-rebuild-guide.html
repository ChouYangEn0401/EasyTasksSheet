p.ini": "APP_NAME = Gitea: NTU Git System\nRUN_USER = Administrator\nWORK_PATH = C:\\gitea\nRUN_MODE = prod\n\n[database]\nDB_TYPE = sqlite3\nHOST = 127.0.0.1:3306\nNAME = gitea\nUSER = gitea\nPASSWD =\nSCHEMA = \nSSL_MODE = disable\nPATH = C:\\gitea\\data\\gitea.db\nLOG_SQL = false\n\n[repository]\nROOT = C:/gitea/data/gitea-repositories\n\n[server]\nSSH_DOMAIN = 140.112.180.152\nDOMAIN = 140.112.180.152\nHTTP_ADDR = 127.0.0.1\nHTTP_PORT = 3000\nROOT_URL = https://140.112.180.152/gitea/\nAPP_DATA_PATH = C:\\gitea\\data\nDISABLE_SSH = false\nSSH_PORT = 22\nLFS_START_SERVER = true\nLFS_JWT_SECRET = <保密：從舊機的 app.ini 複製，或讓 Gitea 重新產生>\n\n[lfs]\nPATH = C:/gitea/data/lfs\n\n[mailer]\nENABLED = false\n\n[service]\nREGISTER_EMAIL_CONFIRM = false\nENABLE_NOTIFY_MAIL = false\nDISABLE_REGISTRATION = false\nALLOW_ONLY_EXTERNAL_REGISTRATION = false\nENABLE_CAPTCHA = false\nREQUIRE_SIGNIN_VIEW = false\nDEFAULT_KEEP_EMAIL_PRIVATE = false\nDEFAULT_ALLOW_CREATE_ORGANIZATION = true\nDEFAULT_ENABLE_TIMETRACKING = true\nNO_REPLY_ADDRESS = noreply.localhost\n\n[openid]\nENABLE_OPENID_SIGNIN = true\nENABLE_OPENID_SIGNUP = true\n\n[cron.update_checker]\nENABLED = false\n\n[session]\nPROVIDER = file\n\n[log]\nMODE = console\nLEVEL = info\nROOT_PATH = C:/gitea/log\n\n[repository.pull-request]\nDEFAULT_MERGE_STYLE = merge\n\n[repository.signing]\nDEFAULT_TRUST_MODEL = committer\n\n[security]\nINSTALL_LOCK = true\nINTERNAL_TOKEN = <保密：從舊機的 app.ini 複製，或讓 Gitea 重新產生>\nPASSWORD_HASH_ALGO = pbkdf2\n\n[oauth2]\nJWT_SECRET = <保密：從舊機的 app.ini 複製，或讓 Gitea 重新產生>", "nginx.conf": "worker_processes  1;\n\nevents {\n    worker_connections  1024;\n}\n\nhttp {\n    charset utf-8;\n    client_max_body_size 256m;\n    include       mime.types;\n    default_type  application/octet-stream;\n    sendfile        on;\n    keepalive_timeout  65;\n\n    # ===== Port 80:校內限定,強制導向 https =====\n    server {\n        listen       80;\n        server_name  140.112.180.152;\n\n        allow 140.112.46.0/24;\n        allow 140.112.180.0/24;\n        allow 140.112.92.0/24;\n        deny all;\n\n        return 301 https://$host$request_uri;\n    }\n\n    # ===== Port 443:校內限定,TLS termination,路徑分流 =====\n    server {\n        listen       443 ssl;\n        server_name  140.112.180.152;\n\n        allow 140.112.46.0/24;\n        allow 140.112.180.0/24;\n        allow 140.112.92.0/24;\n        deny all;\n\n        ssl_certificate      C:/nginx/ssl/server.crt;\n        ssl_certificate_key  C:/nginx/ssl/server.key;\n        ssl_protocols        TLSv1.2 TLSv1.3;\n        ssl_ciphers          HIGH:!aNULL:!MD5;\n        ssl_prefer_server_ciphers  on;\n\n        # 首頁先放簡單提示,之後你想做導覽頁再換掉這段\n        location = / {\n            root   html;\n            try_files /jump_page.html =404;\n        }\n\n        # --- pyDMS ---\n        # 注意:proxy_pass結尾「不能」加斜線,原樣轉發完整路徑給pyDMS\n        # 這是配合 NDMS_URL_PREFIX=/pydms,由pyDMS自己認得這個前綴\n        location /pydms/ {\n            proxy_pass http://127.0.0.1:8000;\n            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto https;\n        }\n\n        # --- Gitea ---\n        # 注意:proxy_pass結尾「要」加斜線,nginx會把/gitea/這段前綴剝掉\n        # 這是Gitea官方標準做法,Gitea自己不知道/gitea前綴,靠ROOT_URL自己補回連結\n        location /gitea/ {\n            proxy_pass http://127.0.0.1:3000/;\n            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto https;\n        }\n\n        error_page   500 502 503 504  /50x.html;\n        location = /50x.html {\n            root   html;\n        }\n    }\n}", "scripts/install_pydms_service.bat": "@echo off\n@echo off\nchcp 65001 >nul\nsetlocal EnableExtensions DisableDelayedExpansion\nrem ====================================================================\nrem install_pydms_service.bat\nrem 用途：把 pyDMS 註冊成 Windows 服務 python-dms（由 NSSM 看管）。\nrem       可重複執行：已有同名服務時，會先停止、移除，再用目前設定重建。\nrem 用法（都要在「系統管理員」的 cmd 執行）：\nrem   install_pydms_service.bat check   只做檢查，不改任何東西（建議先跑）\nrem   install_pydms_service.bat         檢查通過後，停舊服務、重新註冊、啟動、驗證\nrem 這支腳本不會做的事：不建 .venv、不安裝套件、不複製 .env、不刪任何資料夾。\nrem ====================================================================\n\nrem ---------- 設定區：搬資料夾時只改這幾行 ----------\nset \"NSSM=C:\\nssm\\win64\\nssm.exe\"\nset \"SVC=python-dms\"\nset \"DMS_DIR=C:\\pyDMS\"\nset \"PYTHON_EXE=%DMS_DIR%\\.venv\\Scripts\\python.exe\"\nset \"DMS_ENTRY=run.py\"\nset \"BACKEND_PORT=8000\"\nset \"URL_PREFIX=/pydms\"\nrem --------------------------------------------------\n\nset \"MODE=%~1\"\nset /a ERRS=0\nset /a WARNS=0\n\necho ==========================================\necho  註冊 pyDMS 服務：%SVC%\necho  專案資料夾：%DMS_DIR%\necho ==========================================\necho.\n\nnet session >nul 2>&1\nif errorlevel 1 goto :need_admin\n\necho [1/5] 檢查必要檔案\ncall :chk_file \"%NSSM%\" \"找不到 NSSM\"\ncall :chk_file \"%DMS_DIR%\\%DMS_ENTRY%\" \"找不到進入點，資料夾是否 clone 好了\"\ncall :chk_file \"%PYTHON_EXE%\" \"找不到 venv 的 Python，請先建立 .venv 並安裝套件\"\ncall :chk_file \"%DMS_DIR%\\.env\" \"找不到 .env，新 clone 的資料夾不會有它，要從舊機或備份複製\"\necho.\n\necho [2/5] 檢查 .env 的關鍵設定\nif not exist \"%DMS_DIR%\\.env\" goto :skip_env\nfindstr /r /b /c:\"NDMS_HOST *= *127\\.0\\.0\\.1\" \"%DMS_DIR%\\.env\" >nul\nif errorlevel 1 call :warn \"NDMS_HOST 不是 127.0.0.1：後端可能對外直接開放，繞過 nginx 與防火牆的設計\"\nfindstr /r /b /c:\"NDMS_PORT *= *%BACKEND_PORT%\" \"%DMS_DIR%\\.env\" >nul\nif errorlevel 1 call :warn \"NDMS_PORT 不是 %BACKEND_PORT%：nginx 轉發的是 %BACKEND_PORT%，兩邊要一致\"\nfindstr /r /b /c:\"NDMS_URL_PREFIX *= *%URL_PREFIX%\" \"%DMS_DIR%\\.env\" >nul\nif errorlevel 1 call :warn \"NDMS_URL_PREFIX 不是 %URL_PREFIX%：網址前綴要和 nginx 的 location 一致\"\nfindstr /r /b /c:\"NDMS_TRUST_PROXY *= *1\" \"%DMS_DIR%\\.env\" >nul\nif errorlevel 1 call :warn \"NDMS_TRUST_PROXY 不是 1：登入紀錄會把所有人都記成 127.0.0.1\"\n:skip_env\necho.\n\necho [3/5] 目前的服務狀態\nsc query %SVC% >nul 2>&1\nif errorlevel 1 goto :no_old_service\necho   已存在服務 %SVC%，目前註冊的值（請記下來，要退回時用得到）：\n\"%NSSM%\" get %SVC% Application\n\"%NSSM%\" get %SVC% AppDirectory\n\"%NSSM%\" get %SVC% AppParameters\ngoto :after_old_service\n:no_old_service\necho   尚未註冊 %SVC%，將建立新服務。\n:after_old_service\necho.\n\necho 檢查結果：錯誤 %ERRS% 項，警告 %WARNS% 項\nif %ERRS% GTR 0 goto :has_errors\nif /i \"%MODE%\"==\"check\" goto :check_only\necho.\necho 警告不會擋住安裝，請確認上面的警告是你預期的。\nset /p ANS=確定要停止並重新註冊 %SVC% 嗎？輸入 YES 繼續：\nif /i not \"%ANS%\"==\"YES\" goto :cancelled\n\necho.\necho [4/5] 停止並移除舊服務，然後重新註冊\nsc query %SVC% >nul 2>&1\nif errorlevel 1 goto :do_install\nnet stop %SVC% >nul 2>&1\ntimeout /t 3 /nobreak >nul\npowershell -NoProfile -Command \"if ((Get-Service '%SVC%').Status -eq 'Stopped') { exit 0 } else { exit 1 }\"\nif errorlevel 1 goto :stop_failed\n\"%NSSM%\" remove %SVC% confirm\ntimeout /t 2 /nobreak >nul\n\n:do_install\nnetstat -ano | findstr /r /c:\":%BACKEND_PORT% .*LISTENING\" >nul\nif not errorlevel 1 goto :port_busy\n\nif not exist \"%DMS_DIR%\\logs\" mkdir \"%DMS_DIR%\\logs\"\n\n\"%NSSM%\" install %SVC% \"%PYTHON_EXE%\"\nif errorlevel 1 goto :install_failed\n\"%NSSM%\" set %SVC% AppDirectory \"%DMS_DIR%\"\n\"%NSSM%\" set %SVC% AppParameters \"%DMS_ENTRY%\"\n\"%NSSM%\" set %SVC% DisplayName \"Python-DMS Web Service\"\n\"%NSSM%\" set %SVC% Description \"pyDMS FastAPI application behind nginx\"\n\"%NSSM%\" set %SVC% Start SERVICE_AUTO_START\nrem 程式結束就自動重啟；停 5 秒再起，避免當掉時瘋狂重啟\n\"%NSSM%\" set %SVC% AppExit Default Restart\n\"%NSSM%\" set %SVC% AppRestartDelay 5000\nrem 日誌：UTF-8 加不緩衝，否則中文會亂碼、訊息會卡在緩衝區\n\"%NSSM%\" set %SVC% AppEnvironmentExtra PYTHONIOENCODING=utf-8 PYTHONUNBUFFERED=1\n\"%NSSM%\" set %SVC% AppStdout \"%DMS_DIR%\\logs\\dms.out.log\"\n\"%NSSM%\" set %SVC% AppStderr \"%DMS_DIR%\\logs\\dms.err.log\"\n\"%NSSM%\" set %SVC% AppRotateFiles 1\n\"%NSSM%\" set %SVC% AppRotateBytes 10485760\n\necho.\necho [5/5] 啟動並驗證\nnet start %SVC%\nif errorlevel 1 goto :start_failed\ntimeout /t 6 /nobreak >nul\n\necho.\necho --- 服務狀態 ---\npowershell -NoProfile -Command \"Get-Service '%SVC%' | Format-Table Name, Status, StartType -AutoSize\"\necho.\necho --- 後端監聽位址（必須是 127.0.0.1:%BACKEND_PORT%，不可以是 0.0.0.0）---\nnetstat -ano | findstr /r /c:\":%BACKEND_PORT% .*LISTENING\"\nnetstat -ano | findstr /r /c:\"0\\.0\\.0\\.0:%BACKEND_PORT% .*LISTENING\" >nul\nif not errorlevel 1 echo   [錯誤] 後端綁在 0.0.0.0，任何人可繞過 nginx 直連，請立即檢查 .env 的 NDMS_HOST\necho.\necho --- 後端回應（直連 127.0.0.1，只用來確認程式活著）---\npowershell -NoProfile -Command \"try { $r = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:%BACKEND_PORT%%URL_PREFIX%/login'; 'HTTP ' + $r.StatusCode } catch { if ($_.Exception.Response) { 'HTTP ' + [int]$_.Exception.Response.StatusCode } else { '連不上：' + $_.Exception.Message } }\"\necho.\necho --- 啟動 log 最後 15 行 ---\nif exist \"%DMS_DIR%\\logs\\dms.out.log\" powershell -NoProfile -Command \"Get-Content -Tail 15 -Encoding UTF8 '%DMS_DIR%\\logs\\dms.out.log'\"\necho.\necho 完成。接著請從「校內白名單的電腦」用瀏覽器開 https://140.112.180.152%URL_PREFIX%/login 確認。\ngoto :end\n\n:check_only\necho.\necho 這是 check 模式，沒有改任何東西。\ngoto :end\n\n:cancelled\necho 已取消，沒有改任何東西。\ngoto :end\n\n:has_errors\necho.\necho 有錯誤，沒有改任何東西。請先修正上面標示 [錯誤] 的項目。\nexit /b 1\n\n:need_admin\necho [錯誤] 請用「系統管理員」身分執行 cmd，再執行本腳本。\nexit /b 1\n\n:stop_failed\necho [錯誤] 舊服務沒有在預期時間內停止。\necho        本腳本不會強制結束行程。請手動確認 python.exe 是否還在跑，再重新執行。\nexit /b 1\n\n:port_busy\necho [錯誤] %BACKEND_PORT% 埠已有程式在聽，無法啟動新服務。\necho        查是誰在用：netstat -ano ^| findstr :%BACKEND_PORT%，再用工作管理員或 Get-Process 對照 PID。\nexit /b 1\n\n:install_failed\necho [錯誤] nssm install 失敗，服務沒有建立。\nexit /b 1\n\n:start_failed\necho [錯誤] 服務啟動失敗。請看 %DMS_DIR%\\logs\\dms.err.log。\necho        也可以先用前景方式找原因：cd /d %DMS_DIR% ^&^& .venv\\Scripts\\python.exe run.py\nexit /b 1\n\n:chk_file\nif exist \"%~1\" goto :chk_file_ok\necho   [錯誤] %~2：%~1\nset /a ERRS+=1\ngoto :eof\n:chk_file_ok\necho   [OK] %~1\ngoto :eof\n\n:warn\necho   [警告] %~1\nset /a WARNS+=1\ngoto :eof\n\n:end\nendlocal\n", "scripts/uninstall_pydms_service.bat": "@echo off\n@echo off\nchcp 65001 >nul\nsetlocal EnableExtensions DisableDelayedExpansion\nrem ====================================================================\nrem uninstall_pydms_service.bat\nrem 用途：把 Windows 服務 python-dms 停止並移除（收尾、換機、換資料夾前用）。\nrem 用法（在「系統管理員」的 cmd 執行）：\nrem   uninstall_pydms_service.bat\nrem 這支腳本不會做的事：不刪專案資料夾、不刪 .env、資料與 log，不動 nginx 與 Gitea，\nrem                      也不會強制結束行程。要刪資料夾請在確認備份後手動處理。\nrem ====================================================================\n\nset \"NSSM=C:\\nssm\\win64\\nssm.exe\"\nset \"SVC=python-dms\"\nset \"BACKEND_PORT=8000\"\n\necho ==========================================\necho  移除 pyDMS 服務：%SVC%\necho ==========================================\necho.\n\nnet session >nul 2>&1\nif errorlevel 1 goto :need_admin\n\nif not exist \"%NSSM%\" goto :no_nssm\n\nsc query %SVC% >nul 2>&1\nif errorlevel 1 goto :not_registered\n\necho 目前的服務設定（移除前先記錄，要重新註冊時用得到）：\n\"%NSSM%\" get %SVC% Application\n\"%NSSM%\" get %SVC% AppDirectory\n\"%NSSM%\" get %SVC% AppParameters\n\"%NSSM%\" get %SVC% AppStdout\necho.\necho 即將停止並移除服務 %SVC%。專案資料夾、.env、資料與 log 都不會被刪除。\nset /p ANS=輸入 YES 繼續：\nif /i not \"%ANS%\"==\"YES\" goto :cancelled\n\necho.\necho [1/3] 停止服務\nnet stop %SVC% >nul 2>&1\ntimeout /t 3 /nobreak >nul\npowershell -NoProfile -Command \"if ((Get-Service '%SVC%').Status -eq 'Stopped') { exit 0 } else { exit 1 }\"\nif errorlevel 1 goto :stop_failed\n\necho [2/3] 移除服務\n\"%NSSM%\" remove %SVC% confirm\ntimeout /t 2 /nobreak >nul\n\necho [3/3] 確認結果\nsc query %SVC% >nul 2>&1\nif not errorlevel 1 goto :still_there\necho   [OK] 服務 %SVC% 已不存在\nnetstat -ano | findstr /r /c:\":%BACKEND_PORT% .*LISTENING\" >nul\nif errorlevel 1 goto :port_free\necho   [注意] %BACKEND_PORT% 埠仍有程式在聽，可能是手動啟動的行程。查法：\necho          netstat -ano ^| findstr :%BACKEND_PORT%\ngoto :done\n:port_free\necho   [OK] %BACKEND_PORT% 埠已釋放\n:done\necho.\necho 完成。pyDMS 現在不會在背景執行，nginx 的 /pydms/ 會回 502，這是預期的。\necho 要重新註冊，請執行 install_pydms_service.bat。\ngoto :end\n\n:not_registered\necho 服務 %SVC% 不存在，不需要處理。\ngoto :end\n\n:cancelled\necho 已取消，沒有改任何東西。\ngoto :end\n\n:need_admin\necho [錯誤] 請用「系統管理員」身分執行 cmd，再執行本腳本。\nexit /b 1\n\n:no_nssm\necho [錯誤] 找不到 NSSM：%NSSM%\nexit /b 1\n\n:stop_failed\necho [錯誤] 服務沒有在預期時間內停止。本腳本不會強制結束行程。\necho        請手動確認 python.exe 是否還在跑，再重新執行。\nexit /b 1\n\n:still_there\necho [錯誤] 服務仍然存在，請手動執行：sc query %SVC%\nexit /b 1\n\n:end\nendlocal\n", "scripts/services_restarter.bat": "@echo off\nchcp 65001 >nul\necho ==========================================\necho   正在重新啟動 Gitea, Nginx, Python-DMS 服務...\necho ==========================================\necho.\n\necho [1/3] 重新啟動 Gitea...\nnet stop gitea >nul 2>&1\nnet start gitea\n\necho [2/3] 重新啟動 Nginx...\nnet stop nginx >nul 2>&1\nnet start nginx\n\necho [3/3] 重新啟動 Python-DMS...\nnet stop python-dms\nnet start python-dms\n\necho.\necho ==========================================\necho   所有服務重啟指令已發送！\necho ==========================================\npause\n\n", "scripts/services_terminator.bat": "@echo off\nchcp 65001 >nul\necho ==========================================\necho   正在關閉 Gitea, Nginx, Python-DMS 服務...\necho ==========================================\necho.\n\necho [1/3] 執行關閉 Gitea...\nnet stop gitea >nul 2>&1\n\necho [2/3] 執行關閉 Nginx...\nnet stop nginx >nul 2>&1\n\necho [3/3] 執行關閉 Python-DMS...\nnet stop python-dms\n\necho.\necho ==========================================\necho   所有服務關閉指令已發送！\necho ==========================================\npause\n\n"}, "handbook": "https://claude.ai/artifact/EYxAdfmi7Dd3C7Y35hcxEa"}</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("guide-data").textContent);
  var STEPS = DATA.steps, ROUTES = DATA.routes, FILES = DATA.files, HANDBOOK = DATA.handbook;
  var ORDER = DATA.order;
  var TABKEY = "guide152.tab", tabMem = "inst";
  function loadTab() { try { var v = window.localStorage.getItem(TABKEY); if (v === "inst" || v === "manual") { tabMem = v; } } catch (e) { /* 沒有也沒關係 */ } return tabMem; }
  function saveTab(v) { tabMem = v; try { window.localStorage.setItem(TABKEY, v); } catch (e) { /* 沒有也沒關係 */ } }
  var KEY = "guide152.progress";
  var ENV = {
    ps152: "152 · PowerShell（系統管理員）", cmd152: "152 · cmd（系統管理員）", old: "舊機 · PowerShell（系統管理員）",
    mech: "機械系電腦（校內）", phone: "手機（校外）", browser: "瀏覽器", notepad: "記事本"
  };
  var ENV_WHAT = {
    ps152: "用遠端桌面連進 152，在「開始」按右鍵，選 Windows PowerShell（系統管理員）。",
    cmd152: "同樣在 152 上，用「以系統管理員身分執行」開啟命令提示字元。",
    old: "在舊的那台機器上做，一樣用系統管理員的 PowerShell。只有路線 A 的前幾步會用到。",
    mech: "校內白名單網段裡的另一台電腦，用來確認校內連得上。",
    phone: "關掉 Wi-Fi、用行動網路的手機，用來確認校外連不上。",
    browser: "在瀏覽器裡操作，沒有指令。",
    notepad: "在 152 上用記事本貼上內容或修改檔案。"
  };
  var TIP = { note: "補充", warn: "注意", "if": "如果", ok: "好消息" };
  var $ = function (id) { return document.getElementById(id); };
  var cur = { route: null, i: -1 };   // i = -1 代表開頭的選路線頁
  var mem = null;                      // 沒有 localStorage 時，進度只留在記憶體

  function load() {
    try { var v = JSON.parse(window.localStorage.getItem(KEY) || "null"); if (v && ROUTES[v.r] && v.i >= 0 && v.i < ROUTES[v.r].steps.length) { return v; } } catch (e) { /* 沒有也沒關係 */ }
    return mem;
  }
  function save() {
    var v = cur.route && cur.i >= 0 ? { r: cur.route, i: cur.i } : null;
    mem = v || mem;
    if (!v) { return; }
    try { window.localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) { /* 沒有也沒關係 */ }
  }
  function forget() { mem = null; try { window.localStorage.removeItem(KEY); } catch (e) { /* 沒有也沒關係 */ } }

  function hashFor(route, i) { return route && i >= 0 ? "#" + route + "-step-" + (i + 1) : "#start"; }
  function parseHash() {
    var h = (location.hash || "").replace(/^#/, "");
    var m = /^([a-g])-step-(\d+)$/.exec(h);
    if (m) { return clamp(m[1], +m[2] - 1); }
    m = /^step-(\d+)$/.exec(h);
    if (m) { var s = load(); return clamp(cur.route || (s && s.r) || "a", +m[1] - 1); }
    return { route: cur.route, i: -1 };
  }
  function clamp(r, i) { var n = ROUTES[r].steps.length; return { route: r, i: Math.max(0, Math.min(n - 1, i || 0)) }; }
  function go(route, i) {
    var h = hashFor(route, i);
    if (location.hash === h) { show(route, i); } else { location.hash = h; }
  }

  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) { e.className = cls; } if (html != null) { e.innerHTML = html; } return e; }
  function envTag(k) { var s = el("span", "env " + k); s.appendChild(document.createTextNode(ENV[k])); return s; }

  function codePre(text) {
    var pre = el("pre"), code = el("code");
    code.style.cssText = "background:none;padding:0;font-size:inherit";
    code.textContent = text;
    pre.appendChild(code);
    return pre;
  }
  function copyBtn(text, fileKey) {
    var b = el("button", "copy"); b.type = "button"; b.textContent = "複製";
    if (fileKey) { b.setAttribute("data-file", fileKey); }
    b.addEventListener("click", function () {
      var pre = b.closest(".cmd").querySelector("pre");
      var done = function (t, ok) { b.textContent = t; b.classList.toggle("done", !!ok); setTimeout(function () { b.textContent = "複製"; b.classList.remove("done"); }, 1800); };
      var fallback = function () {
        try { var r = document.createRange(); r.selectNodeContents(pre); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) { /* 選不到就算了 */ }
        done("已選取，請按 Ctrl+C", false);
      };
      try { navigator.clipboard.writeText(text).then(function () { done("已複製", true); }, fallback); } catch (e) { fallback(); }
    });
    return b;
  }
  function notes(list) { var ul = el("ul", "notes"); list.forEach(function (h) { ul.appendChild(el("li", null, h)); }); return ul; }

  function block(b) {
    var box, head;
    if (b.t === "cmd") {
      box = el("div", "cmd");
      head = el("div", "cmd-head");
      head.appendChild(envTag(b.env));
      var lab = el("span", "label"); lab.textContent = b.label; head.appendChild(lab);
      head.appendChild(copyBtn(b.code));
      box.appendChild(head); box.appendChild(codePre(b.code));
      if (b.notes && b.notes.length) { box.appendChild(notes(b.notes)); }
      return box;
    }
    if (b.t === "file") {
      var wrap = el("div", "stack"); wrap.style.marginTop = "0";
      box = el("div", "cmd file");
      head = el("div", "cmd-head");
      head.appendChild(envTag("notepad"));
      var l2 = el("span", "label"); l2.textContent = "存成檔案"; head.appendChild(l2);
      head.appendChild(copyBtn(FILES[b.key], b.key));
      box.appendChild(head);
      var meta = el("div", "filemeta");
      meta.appendChild(el("span", "k", "完整路徑"));
      var p = el("code", "path"); p.textContent = b.path; meta.appendChild(p);
      meta.appendChild(el("span", "k", "編碼"));
      meta.appendChild(el("span", null, "UTF-8，<strong>不要有 BOM</strong>。有 BOM 的話，nginx 設定會讀不到第一行，batch 的第一行也會出錯。"));
      box.appendChild(meta);
      box.appendChild(codePre(FILES[b.key]));
      var how = el("div", "how", b.note + "<ol><li>按「複製」，在 152 上開記事本，貼上全文。</li><li>「另存新檔」：存檔類型選「所有檔案」，檔名貼上上面的完整路徑，編碼選「UTF-8」（清單裡同時有「UTF-8」和「具有 BOM 的 UTF-8」時，選前者）。</li></ol>");
      box.appendChild(how);
      wrap.appendChild(box);
      wrap.appendChild(block({ t: "cmd", env: b.cenv, label: "檢查這個檔案存好了", code: b.ccode, notes: [b.cnote] }));
      return wrap;
    }
    if (b.t === "tip") {
      box = el("div", "tip " + b.k);
      box.appendChild(el("span", "k", TIP[b.k])); box.appendChild(el("div", null, b.h));
      return box;
    }
    if (b.t === "table") {
      box = el("div", "tablewrap");
      var t = el("table"), tr = el("tr");
      b.head.forEach(function (h) { tr.appendChild(el("th", null, h)); });
      var th = el("thead"); th.appendChild(tr); t.appendChild(th);
      var tb = el("tbody");
      b.rows.forEach(function (r) { var row = el("tr"); r.forEach(function (c) { row.appendChild(el("td", null, c)); }); tb.appendChild(row); });
      t.appendChild(tb); box.appendChild(t);
      return box;
    }
    if (b.t === "list") { box = el("ol", "steps"); b.items.forEach(function (h) { box.appendChild(el("li", null, h)); }); if (b.items.length === 1) { box.className = "plain"; box.style.listStyle = "disc"; } return box; }
    if (b.t === "check") {
      box = el("ul", "checks");
      b.items.forEach(function (h, i) {
        var li = el("li"), lb = el("label"), cb = el("input");
        cb.type = "checkbox"; cb.id = "chk-" + i;
        lb.appendChild(cb); lb.appendChild(el("span", null, h)); li.appendChild(lb); box.appendChild(li);
      });
      return box;
    }
    if (b.t === "alt") {
      box = el("details", "alt");
      var sm = el("summary"); sm.textContent = b.title; box.appendChild(sm);
      var st = el("div", "stack"); b.blocks.forEach(function (x) { st.appendChild(block(x)); });
      box.appendChild(st);
      return box;
    }
    if (b.t === "fig") {
      return el("div", "flow",
        '<p class="cap">請求怎麼走</p><div class="row">' +
        '<div class="box"><b>校內電腦</b>三個白名單網段</div><span class="arr">→</span>' +
        '<div class="box"><b>Windows 防火牆</b>只放行 80、443<br>校外在這裡逾時</div><span class="arr">→</span>' +
        '<div class="box key"><b>nginx</b>80 轉到 443<br>443 持有憑證，再檢查一次來源</div><span class="arr">→</span>' +
        '<div class="split"><div class="box"><b>Gitea</b><code>/gitea/</code> → 127.0.0.1:3000</div><div class="box"><b>pyDMS</b><code>/pydms/</code> → 127.0.0.1:8000</div></div>' +
        '</div><p class="foot">後面兩個程式只聽 127.0.0.1，外面的人一定要經過 nginx 才碰得到。</p>');
    }
    if (b.t === "paths") {
      box = el("div", "paths");
      ORDER.forEach(function (r) {
        var R = ROUTES[r], bt = el("button", "path"); bt.type = "button"; bt.setAttribute("data-route", r);
        bt.innerHTML = '<span class="letter">' + r.toUpperCase() + '</span><span class="t"></span><span class="d"></span><span class="n"></span>';
        bt.querySelector(".t").textContent = R.title; bt.querySelector(".d").textContent = R.desc;
        if (R.flag) { var fl = el("span", "flag"); fl.textContent = R.flag; bt.querySelector(".t").appendChild(fl); }
        bt.querySelector(".n").textContent = "共 " + R.steps.length + " 步";
        bt.addEventListener("click", function () { go(r, 0); });
        box.appendChild(bt);
      });
      return box;
    }
    if (b.t === "envlegend") {
      box = el("div");
      box.appendChild(el("h2", "sec", "每個指令上方都會標示「在哪裡做」"));
      var ul = el("ul", "legend");
      ["ps152", "cmd152", "mech", "phone", "browser", "notepad"].forEach(function (k) {
        var li = el("li"); li.appendChild(envTag(k)); var w = el("span", "what"); w.textContent = ENV_WHAT[k]; li.appendChild(w); ul.appendChild(li);
      });
      box.appendChild(ul);
      return box;
    }
    return el("div");
  }

  function result(cls, title, items) {
    var box = el("section", "result " + cls); box.appendChild(el("h2", null, title));
    var ul = el("ul"); items.forEach(function (h) { ul.appendChild(el("li", null, h)); }); box.appendChild(ul);
    return box;
  }

  function show(route, i) {
    cur.route = route; cur.i = i;
    var onStart = i < 0, R = route ? ROUTES[route] : null;
    var s = onStart ? STEPS.start : STEPS[R.steps[i]];
    var total = R ? R.steps.length : 0;
    $("chapter").textContent = s.ch;
    $("title").textContent = s.title;
    $("lede").innerHTML = s.body.map(function (p) { return "<p>" + p + "</p>"; }).join("");
    var host = $("blocks"); host.innerHTML = "";
    if (s.env) { var ev = el("div"); ev.appendChild(envTag(s.env)); host.appendChild(ev); }
    if (s.danger) { host.appendChild(el("div", "danger", '<span class="k">動手前先看：這一步會改動或中斷東西</span>' + s.danger)); }
    var chip = $("stagechip");
    chip.hidden = !s.stage;
    if (s.stage) {
      chip.innerHTML = s.stage === "manual" ? '<span class="k">installer</span><span class="m">這一頁只有手動做法，installer 不做</span>' : '<span class="k">installer</span><code></code>';
      if (s.stage !== "manual") { chip.querySelector("code").textContent = s.stage; }
    }
    if (s.inst) {
      var bar = el("div", "tabs"); bar.setAttribute("role", "tablist");
      var pI = el("div", "tabpanel"), pM = el("div", "tabpanel");
      pI.setAttribute("data-panel", "inst"); pM.setAttribute("data-panel", "manual");
      if (s.gate) { pI.appendChild(block({ t: "tip", k: "note", h: "階段不能跳：installer 開始這個階段之前，會重新檢查前面每個階段是否仍然成立，沒過就停。想先自己看上一個階段（唯讀）：<code>.\\install.cmd -Stage " + s.gate + " -Check</code>" })); }
      s.inst.forEach(function (b) { pI.appendChild(block(b)); });
      (s.blocks || []).forEach(function (b) { pM.appendChild(block(b)); });
      var mk = function (k, label) {
        var b = el("button"); b.type = "button"; b.textContent = label; b.setAttribute("role", "tab"); b.setAttribute("data-tab", k);
        b.addEventListener("click", function () { saveTab(k); pick(k); });
        bar.appendChild(b); return b;
      };
      var bI = mk("inst", "用 installer"), bM = mk("manual", "手動做法");
      var pick = function (k) { pI.hidden = k !== "inst"; pM.hidden = k !== "manual"; bI.setAttribute("aria-selected", String(k === "inst")); bM.setAttribute("aria-selected", String(k === "manual")); };
      host.appendChild(bar); host.appendChild(pI); host.appendChild(pM);
      pick(loadTab());
    } else {
      (s.blocks || []).forEach(function (b) { host.appendChild(block(b)); });
    }
    if (s.expect && s.expect.length) { host.appendChild(result("expect", "做完你應該看到", s.expect)); }
    if (s.fails && s.fails.length) { host.appendChild(result("fails", "如果不是這樣", s.fails)); }
    if (s.kind === "act") { host.appendChild(el("p", "gate", "這一步會改變機器的狀態。做完、確認結果和上面寫的一樣，再按「下一步」。")); }
    if (s.kind === "ro") { host.appendChild(el("p", "gate ro", "這一頁只有唯讀的查詢，不會改變任何東西。結果符合再按「下一步」。")); }
    if (s.why && s.why.length) {
      var w = el("div", "why"); w.appendChild(el("span", "k", "為什麼"));
      s.why.forEach(function (x) { var a = el("a"); a.href = HANDBOOK + "#" + x[1]; a.target = "_blank"; a.rel = "noopener"; a.textContent = x[0]; w.appendChild(a); });
      host.appendChild(w);
    }

    $("pill").hidden = onStart; $("pill").textContent = R && !onStart ? R.name + "：" + R.label : "";
    $("count").innerHTML = onStart ? "選路線" : "步驟 " + (i + 1) + '<span class="of">／' + total + "</span>";
    var pct = onStart ? 0 : (i + 1) / total * 100;
    $("bar-fill").style.width = pct + "%";
    $("bar").setAttribute("aria-valuemax", String(total || 1)); $("bar").setAttribute("aria-valuenow", String(onStart ? 0 : i + 1));
    $("bar").setAttribute("aria-valuetext", onStart ? "還沒選路線" : R.name + "，步驟 " + (i + 1) + "，共 " + total + " 步");

    var prev = $("prev"), next = $("next"), last = !onStart && i === total - 1;
    prev.disabled = onStart;
    prev.textContent = !onStart && i === 0 ? "回到選路線" : "上一步";
    next.disabled = onStart;
    next.textContent = onStart ? "先選一條路" : last ? "回到開頭" : "下一步";

    var saved = load();
    var offer = onStart && saved;
    $("resume").hidden = !offer;
    if (offer) { $("resume-text").textContent = "上次看到「" + ROUTES[saved.r].name + "：" + ROUTES[saved.r].label + "」步驟 " + (saved.i + 1) + "：" + STEPS[ROUTES[saved.r].steps[saved.i]].title; }
    if (!onStart) { save(); }
    buildToc();
  }

  function moved(first) {
    var t = parseHash();
    var want = hashFor(t.route, t.i);
    if (t.i >= 0 && location.hash !== want) { try { history.replaceState(null, "", want); } catch (e) { /* 沒關係 */ } }
    show(t.route, t.i);
    $("toc").hidden = true;
    try { window.scrollTo(0, 0); } catch (e) { /* 沒關係 */ }
    if (!first) { try { $("title").focus({ preventScroll: true }); } catch (e) { /* 沒關係 */ } }
  }
  function nextStep() {
    if (cur.i < 0 || !cur.route) { return; }
    if (cur.i >= ROUTES[cur.route].steps.length - 1) { go(null, -1); } else { go(cur.route, cur.i + 1); }
  }
  function prevStep() {
    if (cur.i < 0) { return; }
    if (cur.i === 0) { go(cur.route, -1); } else { go(cur.route, cur.i - 1); }
  }

  function buildToc() {
    var body = $("toc-body"), html = "";
    html += '<ol><li><a href="#start"' + (cur.i < 0 ? ' aria-current="step"' : "") + '><span class="n">↺</span><span>選路線（回到開頭）</span></a></li></ol>';
    var list = cur.route && cur.i >= 0 ? [cur.route] : ORDER;
    list.forEach(function (r) {
      var R = ROUTES[r], lastCh = "";
      if (list.length > 1) { html += '<p class="ch">' + R.name + "：" + R.title + "（" + R.steps.length + " 步）</p><ol>"; }
      R.steps.forEach(function (id, i) {
        var s = STEPS[id];
        if (list.length === 1 && s.ch !== lastCh) { html += (lastCh ? "</ol>" : "") + '<p class="ch"></p><ol>'; lastCh = s.ch; html = html.replace(/<p class="ch"><\/p><ol>$/, '<p class="ch" data-ch="' + i + '"></p><ol>'); }
        html += '<li><a href="' + hashFor(r, i) + '"' + (r === cur.route && i === cur.i ? ' aria-current="step"' : "") + ' data-i="' + r + i + '"><span class="n">' + (i + 1) + "</span><span></span></a></li>";
      });
      html += "</ol>";
    });
    body.innerHTML = html;
    list.forEach(function (r) {
      ROUTES[r].steps.forEach(function (id, i) {
        var a = body.querySelector('a[data-i="' + r + i + '"]'); if (a) { a.lastChild.textContent = STEPS[id].title; }
        var c = body.querySelector('p[data-ch="' + i + '"]'); if (c && list.length === 1) { c.textContent = STEPS[id].ch; }
      });
    });
  }
  function openToc() { $("toc").hidden = false; var c = $("toc-body").querySelector("[aria-current]"); if (c && c.scrollIntoView) { c.scrollIntoView({ block: "center" }); } $("toc-close").focus(); }
  function closeToc() { $("toc").hidden = true; $("toc-open").focus(); }

  $("next").addEventListener("click", nextStep);
  $("prev").addEventListener("click", prevStep);
  $("toc-open").addEventListener("click", openToc);
  $("toc-close").addEventListener("click", closeToc);
  $("toc").addEventListener("click", function (e) {
    if (e.target === $("toc")) { closeToc(); return; }
    var a = e.target.closest ? e.target.closest("a") : null;
    if (a) { $("toc").hidden = true; if (a.getAttribute("href") === location.hash || (a.getAttribute("href") === "#start" && cur.i < 0)) { e.preventDefault(); } }
  });
  $("resume-go").addEventListener("click", function () { var s = load(); if (s) { go(s.r, s.i); } });
  $("resume-reset").addEventListener("click", function () { forget(); cur.route = null; $("resume").hidden = true; });
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) { return; }
    var t = e.target, tag = t && t.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (t && t.isContentEditable)) { return; }
    if (e.key === "Escape" && !$("toc").hidden) { closeToc(); return; }
    if (!$("toc").hidden) { return; }
    if (e.key === "ArrowRight") { nextStep(); } else if (e.key === "ArrowLeft") { prevStep(); }
  });
  window.addEventListener("hashchange", function () { moved(false); });
  moved(true);
})();
</script>


</body></html>
