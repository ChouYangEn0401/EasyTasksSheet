<script type="application/json" id="guide-data">{"steps": {"start": {"ch": "開始", "title": "你今天要做哪一件事？", "body": ["這份導覽帶你在 140.112.180.152 這台 Windows Server 上，把 Gitea、pyDMS、nginx 架起來、備份或檢查。一頁只做一件事，做完再按「下一步」。", "每一頁都有兩種做法：<strong>用 installer<\/strong>（一行指令，其餘自動）或<strong>手動做法<\/strong>（一行一行自己下）。先選一條路。"], "blocks": [{"t": "paths"}, {"t": "tip", "k": "warn", "h": "<strong>目前 152 沒有任何備份。<\/strong>不論你今天要做什麼，建議先走一次「E 備份」。"}, {"t": "tip", "k": "note", "h": "目前狀態與目標狀態不一定相同：python-dms 服務現在可能仍指向舊資料夾，<code>C:\\pyDMS<\/code> 是目標 <span class=\"todo\">待補：待確認<\/span>。這份導覽的新流程一律用 <code>C:\\pyDMS<\/code> 與 <code>DZLab/pyDMS<\/code>；舊資料夾只當備援，不會被刪除或修改。"}, {"t": "envlegend"}], "expect": [], "fails": [], "why": [["installer 與導覽怎麼分工", "ig-split"], ["目前名稱與目標名稱", "ov-names"], ["審查結果", "review"]], "kind": "info", "danger": "", "env": "", "stage": "", "gate": "", "inst": null}, "a-prep": {"ch": "開始前", "title": "先確認手邊有這些東西", "body": ["整套重架需要舊機的資料、五個安裝檔，以及三個測試位置。缺任何一樣，先補齊再開始。"], "blocks": [{"t": "tip", "k": "warn", "h": "<strong>目前 152 沒有任何備份。<\/strong><code>backup.bat<\/code> 從未成功執行過。開始前，先確認舊機的資料已經複製到 <strong>C 槽以外<\/strong>的地方（外接硬碟或網路磁碟）。後面有幾頁就是在做這件事；如果舊機已經壞了、手上也沒有副本，倉庫與資料庫是救不回來的，請先停下來找負責人。"}, {"t": "table", "head": ["要準備的東西", "說明"], "rows": [["installer 專案", "<code>dzlab-installer<\/code> 資料夾。由 installer 提供 <span class=\"todo\">待補：下載位置<\/span>；<code>gitea.exe<\/code> 的雜湊也還沒填 <span class=\"todo\">待補<\/span>"], ["舊機的資料", "<code>C:\\gitea\\data<\/code>、<code>app.ini<\/code>、nginx 的 <code>conf<\/code>／<code>ssl<\/code>／<code>html<\/code>、pyDMS 的 <code>.env<\/code> 與 <code>var<\/code>、<code>C:\\scripts<\/code>。下一頁開始帶你複製"], ["nginx", "Windows 版 zip，與舊機同版本。版本與下載位置 <span class=\"todo\">待補<\/span>"], ["Gitea", "<code>gitea.exe<\/code>，版本 <strong>1.27.0<\/strong>（必須與舊機相同）。下載位置 <span class=\"todo\">待補<\/span>"], ["NSSM", "win64 版。版本與下載位置 <span class=\"todo\">待補<\/span>"], ["Python", "3.11 安裝檔，安裝時要選「Install for all users」。修訂號與下載位置 <span class=\"todo\">待補<\/span>"], ["Git for Windows", "內含 openssl。版本與下載位置 <span class=\"todo\">待補<\/span>"], ["遠端桌面（RDP）", "152 只能用遠端桌面管理，帳號 <code>Administrator<\/code>"], ["機械系電腦（校內）", "在白名單網段內，用來測「校內連得上」。需要裝好 git，並且有 <code>curl.exe<\/code>"], ["手機（校外）", "關掉 Wi-Fi、用行動網路，用來測「校外連不上」"], ["Gitea 專用帳號", "152 拉程式碼用的帳號，要讀得到 <code>DZLab/pyDMS<\/code> 與四個同事 repo；之後替它產生唯讀權杖，寫進 <code>.env<\/code>。還沒有的話，導覽後面會帶你建"]]}, {"t": "tip", "k": "note", "h": "新機的 Windows Server 版本與版次 <span class=\"todo\">待補<\/span>。這份導覽的指令以 Windows 內建的 PowerShell 與 cmd 為準。"}, {"t": "fig"}], "expect": ["表格裡每一項都已經在手邊，或知道去哪裡拿。"], "fails": [], "why": [["重架流程總覽", "rebuild"], ["審查對三條路線的結論", "rv-routes"], ["備份", "m-backup"]], "kind": "info", "danger": "", "env": "", "stage": "manual", "gate": "", "inst": null}, "a-old-fsck": {"ch": "從舊機帶走資料", "title": "舊機：檢查倉庫，並記下各軟體的版本", "body": ["先確認倉庫沒有壞，再複製；壞的倉庫搬到新機一樣是壞的。", "舊機離線之後，這些版本資訊就查不到了，所以現在一起記下來。這一頁都是唯讀的。"], "blocks": [{"t": "cmd", "env": "old", "label": "檢查每個倉庫（唯讀）", "code": "$root = \"C:\\gitea\\data\\gitea-repositories\"\nGet-ChildItem $root -Directory | ForEach-Object { Get-ChildItem $_.FullName -Directory } | ForEach-Object {\n  \"=== \" + $_.FullName\n  cmd /c \"git --git-dir=`\"$($_.FullName)`\" fsck --connectivity-only --no-dangling 2>&1\"\n}", "notes": ["<code>Get-ChildItem … -Directory<\/code> 兩層：先列出每個擁有者的資料夾，再列出底下每個 <code>.git<\/code> 倉庫。", "<code>git fsck --connectivity-only --no-dangling<\/code>：確認每個分支與 tag 走得到的物件都存在；不報告無害的 dangling 物件。", "<code>cmd /c \"… 2&gt;&amp;1\"<\/code>：讓錯誤訊息也印在同一個地方。"]}, {"t": "cmd", "env": "old", "label": "查舊機上 pyDMS 的資料夾（唯讀）", "code": "C:\\nssm\\win64\\nssm.exe get python-dms AppDirectory", "notes": ["印出 python-dms 服務目前指向的資料夾。把它記下來，後面複製 <code>.env<\/code> 時要用。"]}, {"t": "cmd", "env": "old", "label": "記下版本（唯讀；把輸出複製到一個文字檔，和備份放在一起）", "code": "Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber\nC:\\nginx\\nginx.exe -v\nC:\\nssm\\win64\\nssm.exe version\nC:\\gitea\\gitea.exe --version\ngit --version\nGet-OdbcDriver | Select-Object Name, Platform", "notes": ["依序是：Windows 版本、nginx、NSSM、Gitea、Git 的版本，以及 ODBC 驅動程式（pyDMS 連 SQL 要用）。", "Python 的版本用舊資料夾的 <code>.venv\\Scripts\\python.exe --version<\/code> 查。", "<code>nssm.exe version<\/code> 這個寫法 <span class=\"todo\">待補：待實測<\/span>。"]}], "expect": ["每個倉庫只印出一行 <code>=== 路徑<\/code>，下面<strong>沒有任何其他輸出<\/strong>，代表通過。", "第二個指令印出一個資料夾路徑（預期是 <code>C:\\pyDMS<\/code>；還沒換過資料夾的話會是舊路徑）。", "版本那一段每一行都有輸出，而且你已經存成文字檔。"], "fails": ["某個倉庫底下有輸出：先不要搬，照交接書事件紀錄的原則處理（只在副本上實驗，不要對原倉庫執行 gc 或 prune）。", "找不到 <code>git<\/code>：這台沒有裝 Git for Windows，或沒有加入 PATH。"], "why": [["第 1 步：從舊機帶走資料", "rb-1"], ["事件紀錄", "incident"]], "kind": "ro", "danger": "", "env": "", "stage": "backup-machine", "gate": "", "inst": [{"t": "cmd", "env": "ps152", "label": "在舊機上：最後一次備份，做完不開服務", "code": "cd <dzlab-installer 資料夾>\n.\\install.cmd -Action backup-machine -Mode cold -KeepStopped -BackupRoot <備份位置>", "notes": ["這行在<strong>舊機<\/strong>上執行（把 installer 資料夾也放一份到舊機）。", "<code>-Mode cold<\/code>：Gitea 與 pyDMS 都停下來再複製。<code>-KeepStopped<\/code>：複製完<strong>不<\/strong>把服務開回來，因為舊機接著就要離線。", "它會順便檢查倉庫、記下各軟體的版本與服務設定，一起放進備份集。", "做完會用醒目的文字提醒你：Gitea 與 python-dms 現在是停止的。"]}]}, "a-old-stop": {"ch": "從舊機帶走資料", "title": "舊機：停止 Gitea 與 pyDMS", "body": ["複製前要先停服務，確保資料庫與倉庫沒有正在寫入。"], "blocks": [{"t": "cmd", "env": "old", "label": "停止兩個服務", "code": "net stop gitea\nnet stop python-dms\n(Get-Service gitea).Status", "notes": ["<code>net stop<\/code>：正常停止服務（不是強制結束）。", "最後一行印出 Gitea 的狀態，用來確認真的停了。"]}], "expect": ["最後一行印出 <code>Stopped<\/code>。"], "fails": ["不是 <code>Stopped<\/code>：等幾秒再執行一次 <code>(Get-Service gitea).Status<\/code>。一直停不下來不要用 <code>taskkill /f<\/code>，先找負責人。", "「存取被拒」：PowerShell 不是用系統管理員身分開的。"], "why": [["第 1 步：從舊機帶走資料", "rb-1"], ["服務啟停注意事項", "m-svc"]], "kind": "act", "danger": "這一步會讓 Gitea 與 pyDMS <strong>暫時停止服務<\/strong>。先確認沒有人正在 push。這是停機切換的起點，請確認維護時段已經公告。退路：隨時可以用 <code>net start gitea<\/code> 與 <code>net start python-dms<\/code> 開回來，資料不會被改動。", "env": "", "stage": "backup-machine", "gate": "", "inst": [{"t": "tip", "k": "note", "h": "用 installer 的話，這一頁已經包含在 <code>backup-machine -KeepStopped<\/code> 裡，不用再做。"}]}, "a-old-copy": {"ch": "從舊機帶走資料", "title": "舊機：把資料複製到 C 槽以外的備份集", "body": ["把重裝軟體也生不回來的東西帶走。資料夾的排法和 installer 的備份集相同，之後不論用哪一種做法還原都對得上。"], "blocks": [{"t": "cmd", "env": "old", "label": "複製（先貼到記事本，把前兩行改好，再貼進 PowerShell）", "code": "$dst = \"<備份位置>\\152_$(Get-Date -Format yyyyMMdd_HHmm)\"   # 不要放 C 槽\n$pydms = \"<pyDMS 資料夾>\"                                   # 前兩頁查到的路徑\nNew-Item -ItemType Directory -Force \"$dst\\pydms\" | Out-Null\nrobocopy C:\\gitea\\data \"$dst\\gitea\\data\" /E /COPY:DAT /R:1 /W:1 /NP /LOG:\"$dst\\gitea-data.log\"\nrobocopy C:\\gitea\\custom \"$dst\\gitea\\custom\" /E /COPY:DAT /R:1 /W:1 /NP\nrobocopy C:\\nginx\\conf \"$dst\\nginx\\conf\" /E /COPY:DAT /R:1 /W:1 /NP\nrobocopy C:\\nginx\\ssl \"$dst\\nginx\\ssl\" /E /COPY:DAT /R:1 /W:1 /NP\nrobocopy C:\\nginx\\html \"$dst\\nginx\\html\" /E /COPY:DAT /R:1 /W:1 /NP\nCopy-Item \"$pydms\\.env\" \"$dst\\pydms\\env\"\nrobocopy \"$pydms\\var\" \"$dst\\pydms\\var\" /E /COPY:DAT /R:1 /W:1 /NP\nrobocopy \"$pydms\" \"$dst\\pydms\\full\" /E /COPY:DAT /R:1 /W:1 /NP /XD .venv __pycache__ .git logs var\nrobocopy C:\\scripts \"$dst\\scripts\" /E /COPY:DAT /R:1 /W:1 /NP\n$dst", "notes": ["<code>robocopy 來源 目的 /E<\/code>：複製所有子資料夾。<code>/COPY:DAT<\/code> 保留資料、屬性與時間戳。<code>/R:1 /W:1<\/code> 讀不到只重試一次。<code>/NP<\/code> 不顯示百分比。", "<code>pydms\\full<\/code>：把 pyDMS 資料夾裡其餘的東西也帶走（<code>/XD<\/code> 排除 <code>.venv<\/code> 等不需要的資料夾）。有些不在 git 裡的資料夾新機可能用得到，先帶走，要不要用之後再決定。", "最後一行印出備份集的完整路徑，<strong>把它記下來<\/strong>，新機每一步都要用。", "複製完<strong>不要<\/strong>把服務開回來：舊機接著就要離線。"]}, {"t": "tip", "k": "warn", "h": "帶走的資料含保密值（<code>app.ini<\/code>、<code>.env<\/code>、<code>server.key<\/code>）。暫存位置用完要刪除，不要放在共用空間。"}], "expect": ["每個 robocopy 結尾摘要的 <code>FAILED<\/code> 欄都是 0（第一個的摘要在 <code>gitea-data.log<\/code> 的結尾）。", "備份集裡的 <code>gitea\\data\\gitea.db<\/code> 存在，大小與 <code>C:\\gitea\\data\\gitea.db<\/code> 相同。"], "fails": ["<code>FAILED<\/code> 不是 0：通常是檔案被占用。確認上一頁的服務真的停了，再重跑這一頁。", "找不到 <code>$pydms\\.env<\/code>：<code>$pydms<\/code> 路徑不對，回前兩頁用 <code>nssm get<\/code> 再查一次。"], "why": [["第 1 步：從舊機帶走資料", "rb-1"], ["搬家要帶什麼", "mg-what"], ["審查：重要問題", "rv-major"]], "kind": "act", "danger": "", "env": "", "stage": "backup-machine", "gate": "", "inst": [{"t": "tip", "k": "note", "h": "用 installer 的話，這一頁已經包含在 <code>backup-machine -KeepStopped<\/code> 裡，不用再做。"}]}, "a-sys": {"ch": "階段 1 · env-set-up", "title": "檢查這台機器：IP、防火牆引擎、必要工具", "body": ["第一個階段確認這台機器能跑後面的東西。這一頁的手動指令都只讀取。"], "blocks": [{"t": "cmd", "env": "ps152", "label": "查詢（唯讀）", "code": "ipconfig | findstr \"IPv4\"                                        # 這台的 IP\nGet-NetConnectionProfile | Select-Object Name, NetworkCategory   # 網路設定檔，預期 Public\nGet-Service mpssvc | Select-Object Status                        # 防火牆引擎，必須 Running\nGet-NetFirewallProfile | Select-Object Name, Enabled             # 三個設定檔都要 True\ncurl.exe --version                                               # 後面的測試會用到\nw32tm /query /status                                             # 時間同步的狀態", "notes": ["Windows 會把校網判成 Public，這沒關係，但代表沒有允許規則的 port 一律被擋。", "<code>curl.exe<\/code> 在較舊的 Windows Server 上沒有內建。找不到的話，Git for Windows 附了一份（路徑 <span class=\"todo\">待補<\/span>）。"]}], "expect": ["IP 是 <code>140.112.180.152<\/code>。", "<code>mpssvc<\/code> 是 <code>Running<\/code>；三個設定檔的 <code>Enabled<\/code> 都是 <code>True<\/code>。", "從機械系電腦能用遠端桌面連進來。"], "fails": ["防火牆設定檔是 <code>False<\/code>：執行 <code>netsh advfirewall set allprofiles state on<\/code>。", "找不到 <code>curl.exe<\/code>：先記下來，裝好 Git 之後再找它附的那一份。", "IP 不是 152：回上一頁。"], "why": [["第 2 步：新機基本設定", "rb-2"], ["IP 變了怎麼辦", "mg-ip"], ["防火牆、port、nginx 的分工", "cc-roles"]], "kind": "ro", "danger": "", "env": "", "stage": "env-set-up", "gate": "", "inst": [{"t": "cmd", "env": "ps152", "label": "執行階段 1", "code": "cd <dzlab-installer 資料夾>\n.\\install.cmd -Stage env-set-up", "notes": ["它會問你：情境（全新機器選 <code>new-machine<\/code>）、主機 IP、校內網段、各個資料夾。直接按 Enter 就是用括號裡的預設值。", "它會檢查系統、Git、Python 3.11，建立需要的資料夾，把 NSSM 放到 <code>C:\\nssm\\win64\\<\/code>。", "Git 或 Python 沒裝好時它會停下來告訴你，裝好再執行一次即可。"]}]}, "a-install": {"ch": "階段 1 · env-set-up", "title": "安裝 Git 與 Python，放好 NSSM", "body": ["Git 與 Python 要自己安裝。Python 一定要選「所有使用者」，否則它會裝在 Administrator 的個人資料夾裡，日後帳號一有變動，服務就起不來。"], "blocks": [{"t": "table", "head": ["軟體", "放到", "備註"], "rows": [["Git for Windows", "安裝程式預設位置", "內含 openssl 與 curl"], ["Python 3.11", "<code>C:\\Program Files\\Python311<\/code>", "自訂安裝 → 勾選 <strong>Install for all users<\/strong> 與 Add to PATH"], ["NSSM", "<code>C:\\nssm\\win64\\nssm.exe<\/code>", "2.24。installer 會放；手動的話從 zip 取出 <code>win64\\nssm.exe<\/code>"]]}, {"t": "cmd", "env": "ps152", "label": "確認裝好了（唯讀；裝完要重開一個 PowerShell 視窗）", "code": "git --version\npy -3.11 -c \"import sys; print(sys.executable)\"\nTest-Path C:\\nssm\\win64\\nssm.exe", "notes": ["第二行印出 Python 3.11 的位置。<code>py -3.11<\/code> 指定用 3.11，避免機器上有別的版本時用錯。"]}], "expect": ["git 印出版本號。", "Python 的位置在 <code>C:\\Program Files\\<\/code> 底下，不在 <code>C:\\Users\\<\/code> 底下。", "最後一行是 <code>True<\/code>。"], "fails": ["Python 在 <code>C:\\Users\\…<\/code> 底下：移除後用「所有使用者」重裝。", "<code>py<\/code> 找不到：安裝時沒有勾選 py launcher，重裝；或重開 PowerShell。"], "why": [["第 3 步：安裝軟體", "rb-3"], ["套件與雜湊", "ig-pkg"], ["審查：重要問題", "rv-major"]], "kind": "act", "danger": "", "env": "", "stage": "env-set-up", "gate": "", "inst": [{"t": "tip", "k": "note", "h": "這一頁的事，installer 在 <code>env-set-up<\/code> 已經一起做了：NSSM 由它放好；Git 與 Python 它只檢查，要你自己裝。nginx 與 Gitea 在後面的階段才放。 不用再下指令。"}, {"t": "cmd", "env": "ps152", "label": "想確認的話：只檢查，不改任何東西", "code": "cd <dzlab-installer 資料夾>\n.\\install.cmd -Stage env-set-up -Check", "notes": ["<code>-Check<\/code>：只跑這個階段的完成檢查，唯讀。"]}]}, "a-restore": {"ch": "階段 3 · gitea-clone-and-deploy", "title": "放好 Gitea，把資料與設定放回原位", "body": ["這個階段的「clone」指的是：把 Gitea 的程式與資料整份搬到這台機器，再部署成服務。"], "blocks": [{"t": "list", "items": ["把 <code>gitea.exe<\/code>（1.27.0，必須和舊機同版本）放到 <code>C:\\gitea\\gitea.exe<\/code>。下載的檔名帶版本號，要改名。"]}, {"t": "cmd", "env": "ps152", "label": "還原（先貼到記事本，把第一行改好）", "code": "$src = \"<備份集資料夾>\"\nC:\\gitea\\gitea.exe --version\nrobocopy \"$src\\gitea\\data\" C:\\gitea\\data /E /COPY:DAT /R:1 /W:1 /NP       # 倉庫、資料庫、LFS\nrobocopy \"$src\\gitea\\custom\" C:\\gitea\\custom /E /COPY:DAT /R:1 /W:1 /NP   # app.ini\nrobocopy \"$src\\scripts\" C:\\scripts /E /COPY:DAT /R:1 /W:1 /NP\nTest-Path C:\\gitea\\data\\gitea.db, C:\\gitea\\custom\\conf\\app.ini", "notes": ["第二行確認 Gitea 的版本。版本不同不要往下：Gitea 啟動時會依版本升級資料庫，升上去之後一般無法降回來。", "最後一行確認資料庫檔與 <code>app.ini<\/code> 都到位。"]}], "expect": ["Gitea 版本是 <code>1.27.0<\/code>。", "每個 robocopy 摘要的 <code>FAILED<\/code> 是 0。", "最後印出兩個 <code>True<\/code>。"], "fails": ["<code>FAILED<\/code> 不是 0：看是哪個檔案，通常是來源讀不到（外接硬碟鬆脫、網路磁碟斷線）。", "<code>gitea.db<\/code> 是 <code>False<\/code>：<code>$src<\/code> 路徑不對，或舊機那邊沒有複製成功。"], "why": [["第 3 步：還原 Gitea 資料", "rb-3"]], "kind": "act", "danger": "這一步會<strong>覆蓋<\/strong> <code>C:\\gitea\\data<\/code>、<code>C:\\gitea\\custom<\/code>、<code>C:\\scripts<\/code> 裡同名的檔案。全新的機器沒有東西可以蓋掉；如果這台不是全新的，先把這三個資料夾另外複製一份再做。", "env": "", "stage": "gitea-clone-and-deploy", "gate": "pyDMS-clone-and-prepare", "inst": [{"t": "cmd", "env": "ps152", "label": "執行階段 3", "code": "cd <dzlab-installer 資料夾>\n.\\install.cmd -Stage gitea-clone-and-deploy", "notes": ["全新機器預設是 <code>restore<\/code> 模式：<code>gitea.exe<\/code> 來自 installer 的 <code>packages<\/code>，資料與 <code>app.ini<\/code> 來自備份集。", "它會：放執行檔 → 還原資料 → 還原 <code>app.ini<\/code> → 核對設定 → 註冊服務 → 啟動。", "<code>gitea.exe<\/code> 的雜湊還沒填進 installer <span class=\"todo\">待補<\/span>；沒填之前它會拒絕執行這個階段，請改用手動做法。", "<span class=\"dflt\">預設決定（可改）<\/span> 會設定「Gitea 當掉自動重啟」（<span class=\"todo\">待補：待實測<\/span>）。"]}]}, "a-clone": {"ch": "階段 2 · pyDMS-clone-and-prepare", "title": "取得 pyDMS 的程式碼", "body": ["pyDMS 的程式放在 Gitea 的倉庫 <code>DZLab/pyDMS<\/code>，工作資料夾用 <code>C:\\pyDMS<\/code>。", "這時新機上還沒有 Gitea，所以直接從<strong>備份集裡的倉庫<\/strong>取得程式；等 Gitea 與 nginx 跑起來，最後一個階段會把來源改成 https 網址。"], "blocks": [{"t": "cmd", "env": "ps152", "label": "先看備份集裡倉庫資料夾的實際名稱（唯讀）", "code": "$src = \"<備份集資料夾>\"\ndir \"$src\\gitea\\data\\gitea-repositories\\dzlab\"", "notes": ["Gitea 會把目錄名稱轉成小寫。下一個指令裡的 <code>pydms.git<\/code> 是依命名規則推測的 <span class=\"todo\">待補：實際名稱<\/span>，以這裡看到的為準。"]}, {"t": "cmd", "env": "ps152", "label": "clone 到 C:\\pyDMS", "code": "$src = \"<備份集資料夾>\"\ngit clone \"$src\\gitea\\data\\gitea-repositories\\dzlab\\pydms.git\" C:\\pyDMS\ncd C:\\pyDMS\ngit status -sb\ngit log -1 --format=\"%h %ci %s\"", "notes": ["<code>git clone 來源 目的<\/code>：把倉庫內容複製成一份工作副本。這個做法不需要 Gitea，也不需要帳號。", "<code>git status -sb<\/code>：印出目前的分支。預期是 <code>master<\/code> <span class=\"todo\">待補：待確認，也可能是 main<\/span>。", "<code>git log -1 …<\/code>：印出最新一筆 commit 的編號、時間與說明。"]}], "expect": ["<code>C:\\pyDMS<\/code> 出現，裡面有 <code>run.py<\/code>。", "<code>git log -1<\/code> 印出預期的最新 commit。"], "fails": ["<code>does not appear to be a git repository<\/code>：路徑裡的倉庫名稱不對，照第一個指令看到的名稱改。", "<code>C:\\pyDMS<\/code> 已存在：先確認裡面是什麼，不要直接刪。"], "why": [["第 4 步：取得 pyDMS 程式碼", "rb-4"], ["installer 的階段", "ig-stages"], ["bare 倉庫是什麼", "gg-bare"]], "kind": "act", "danger": "", "env": "", "stage": "pyDMS-clone-and-prepare", "gate": "env-set-up", "inst": [{"t": "cmd", "env": "ps152", "label": "執行階段 2", "code": "cd <dzlab-installer 資料夾>\n.\\install.cmd -Stage pyDMS-clone-and-prepare", "notes": ["它會問備份集的位置。全新機器的程式來源預設是 <code>backup-bare<\/code>，也就是備份集裡的倉庫。", "它會：取得程式 → 建 <code>.venv<\/code> → 安裝套件 → 放 <code>.env<\/code> → 檢查 <code>.env<\/code> → 複製 <code>var<\/code>。", "這個階段不會註冊服務，也不會停任何東西。"]}]}, "venv": {"ch": "階段 2 · pyDMS-clone-and-prepare", "title": "建立 Python 環境並安裝套件", "body": ["pyDMS 用自己專屬的 Python 環境（<code>.venv<\/code>）。這個資料夾不在 git 裡，每個新資料夾都要重建一次。"], "blocks": [{"t": "cmd", "env": "ps152", "label": "建立 venv、安裝套件", "code": "cd C:\\pyDMS\npy -3.11 -m venv .venv                                            # 建立這個專案專用的 Python 環境\n.\\.venv\\Scripts\\python.exe -m pip install -r requirements.txt     # 安裝相依套件（需要對外網路）\n.\\.venv\\Scripts\\python.exe --version\n.\\.venv\\Scripts\\python.exe -c \"import fastapi; print(fastapi.__version__)\"", "notes": ["<code>py -3.11 -m venv .venv<\/code>：指定用 Python 3.11 建立這個專案專用的環境。", "最後一行用來確認套件真的裝進了 <code>.venv<\/code>，而不是裝到系統的 Python。", "安裝套件需要幾分鐘，等它跑完再看結果。"]}], "expect": ["Python 版本是 <code>3.11.x<\/code>。", "最後一行印出 fastapi 的版本號。"], "fails": ["pip 逾時：對外連線不通，查連出防火牆或代理。", "pyodbc 安裝失敗，或之後連不到 SQL：需要 ODBC 驅動程式，名稱與版本 <span class=\"todo\">待補<\/span>。", "<code>python<\/code> 找不到：回「安裝五樣軟體」那一頁。"], "why": [["第 4 步：建 Python 環境", "rb-4"]], "kind": "act", "danger": "", "env": "", "stage": "pyDMS-clone-and-prepare", "gate": "", "inst": [{"t": "tip", "k": "note", "h": "這一頁的事，installer 在 <code>pyDMS-clone-and-prepare<\/code> 已經一起做了：建立 <code>.venv<\/code> 並安裝套件。 不用再下指令。"}, {"t": "cmd", "env": "ps152", "label": "想確認的話：只檢查，不改任何東西", "code": "cd <dzlab-installer 資料夾>\n.\\install.cmd -Stage pyDMS-clone-and-prepare -Check", "notes": ["<code>-Check<\/code>：只跑這個階段的完成檢查，唯讀。"]}]}, "a-cert": {"ch": "階段 4 · nginx-deploy-and-run", "title": "把憑證放回去", "body": ["nginx 要有憑證才能提供 HTTPS。IP 沒變就直接用舊的兩個檔案，大家的瀏覽器不會再多警告一次。"], "blocks": [{"t": "list", "items": ["手動做法要先把 nginx 的 zip 解壓到 <code>C:\\nginx\\<\/code>：資料夾裡要直接有 <code>nginx.exe<\/code>、<code>conf\\<\/code>、<code>html\\<\/code>、<code>logs\\<\/code>（zip 裡多一層 <code>nginx-1.30.4<\/code>，放的是那一層<strong>裡面<\/strong>的內容）。152 原本的 nginx 是不是同一版 <span class=\"todo\">待補：待確認<\/span>。"]}, {"t": "cmd", "env": "ps152", "label": "還原舊憑證（先把第一行改成你的路徑）", "code": "$src = \"<備份集資料夾>\"\nrobocopy \"$src\\nginx\\ssl\" C:\\nginx\\ssl /E /COPY:DAT /R:1 /W:1 /NP\ndir C:\\nginx\\ssl", "notes": ["<code>dir<\/code>：列出資料夾內容，確認兩個檔案都在。"]}, {"t": "cmd", "env": "ps152", "label": "看憑證的效期與 IP（唯讀）", "code": "certutil -dump C:\\nginx\\ssl\\server.crt | findstr /C:\"NotAfter\" /C:\"IP Address\" /C:\"CN=\"", "notes": ["<code>NotAfter<\/code> 是到期日；<code>IP Address<\/code> 是憑證裡寫的 IP，要是 <code>140.112.180.152<\/code>。"]}, {"t": "alt", "title": "沒有舊憑證、IP 變了，或憑證到期：重新產生一張", "blocks": [{"t": "cmd", "env": "ps152", "label": "重新產生自簽憑證（需要 openssl）", "code": "New-Item -ItemType Directory -Force C:\\nginx\\ssl | Out-Null\ncd C:\\nginx\\ssl\nopenssl req -x509 -nodes -days 3650 -newkey rsa:2048 `\n  -keyout server.key -out server.crt `\n  -subj \"/CN=140.112.180.152\" `\n  -addext \"subjectAltName=IP:140.112.180.152\"", "notes": ["<code>req -x509<\/code>：直接產生自簽憑證。<code>-nodes<\/code>：私鑰不加密碼，nginx 才能在開機時自動讀取。<code>-days 3650<\/code>：效期十年。", "<code>-subj<\/code> 與 <code>-addext subjectAltName<\/code>：把 IP 寫進憑證，少了它瀏覽器與 git 都不會接受。", "行尾的反引號是 PowerShell 的換行符號。", "PowerShell 找不到 <code>openssl<\/code> 時，Git for Windows 內附一份，路徑 <span class=\"todo\">待補<\/span>。", "第一行 <code>New-Item<\/code> 是本導覽加的，用來確保資料夾存在；交接書只寫「另建 <code>C:\\nginx\\ssl\\<\/code>」。"]}]}], "expect": ["<code>C:\\nginx\\ssl<\/code> 裡有 <code>server.crt<\/code> 與 <code>server.key<\/code>。", "到期日還沒到，而且看得到 <code>IP Address=140.112.180.152<\/code>。沒有 IP 那一行：先記下來，目前仍可使用。"], "fails": ["資料夾是空的：<code>$src<\/code> 路徑不對，或舊機那邊沒有複製到 <code>nginx\\ssl<\/code>。", "之後瀏覽器顯示「不安全」：這是自簽憑證的正常行為，不是失敗。"], "why": [["第 5 步：憑證", "rb-5"], ["憑證維護", "m-cert"]], "kind": "act", "danger": "", "env": "", "stage": "nginx-deploy-and-run", "gate": "", "inst": [{"t": "tip", "k": "note", "h": "這一頁的事，installer 在 <code>nginx-deploy-and-run<\/code> 已經一起做了：還原或產生憑證，並檢查效期與 IP。 不用再下指令。"}, {"t": "cmd", "env": "ps152", "label": "想確認的話：只檢查，不改任何東西", "code": "cd <dzlab-installer 資料夾>\n.\\install.cmd -Stage nginx-deploy-and-run -Check", "notes": ["<code>-Check<\/code>：只跑這個階段的完成檢查，唯讀。"]}]}, "a-appini": {"ch": "階段 3 · gitea-clone-and-deploy", "title": "核對 Gitea 的 app.ini", "body": ["<code>app.ini<\/code> 讓 Gitea 只聽本機，並知道自己對外的網址是 <code>/gitea/<\/code>。用前面還原回來的舊檔，不要重新安裝產生。"], "blocks": [{"t": "cmd", "env": "ps152", "label": "只印出要核對的行（唯讀）", "code": "Select-String -Path C:\\gitea\\custom\\conf\\app.ini -Pattern \"^(HTTP_ADDR|HTTP_PORT|ROOT_URL|DB_TYPE|PATH|ROOT|INSTALL_LOCK) *=\"", "notes": ["<code>Select-String … -Pattern<\/code>：只印出這幾個設定，不會把檔案裡的保密值顯示在畫面上。"]}, {"t": "tip", "k": "warn", "h": "不要加 <code>PROTOCOL = https<\/code>。Gitea 只講純 HTTP，HTTPS 是 nginx 的工作。三個保密值（<code>LFS_JWT_SECRET<\/code>、<code>INTERNAL_TOKEN<\/code>、<code>JWT_SECRET<\/code>）沿用舊檔，換掉會讓既有的登入狀態、LFS 與內部呼叫失效。"}, {"t": "alt", "title": "手上沒有舊的 app.ini：用這份全文重建", "blocks": [{"t": "file", "key": "app.ini", "path": "C:\\gitea\\custom\\conf\\app.ini", "note": "這是 152 上的原文，三個保密值已換成 <code>&lt;保密：…&gt;<\/code> 佔位符。從舊機的 <code>app.ini<\/code> 把值複製過來；舊機已經沒了的話，先把這三行刪掉，Gitea 會自己重新產生。<code>PASSWD<\/code> 本來就是空的（用 SQLite，沒有資料庫密碼）。", "cenv": "ps152", "ccode": "Get-Content C:\\gitea\\custom\\conf\\app.ini -TotalCount 5", "cnote": "印出前 5 行（這幾行沒有保密值），確認存到了對的位置。"}, {"t": "cmd", "env": "ps152", "label": "存好後：去掉可能的 BOM", "code": "$f = \"C:\\gitea\\custom\\conf\\app.ini\"\n$t = [System.IO.File]::ReadAllText($f)\n[System.IO.File]::WriteAllText($f, $t, (New-Object System.Text.UTF8Encoding $false))", "notes": ["較舊的記事本存「UTF-8」時會在檔案開頭加一個看不見的標記（BOM）。這三行把檔案重寫成沒有 BOM 的 UTF-8，內容不變。", "Gitea 能不能容忍 BOM <span class=\"todo\">待補：待實測<\/span>，所以一律去掉。"]}]}], "expect": ["<code>HTTP_ADDR = 127.0.0.1<\/code>、<code>HTTP_PORT = 3000<\/code>。", "<code>ROOT_URL = https://140.112.180.152/gitea/<\/code>（結尾有斜線）。", "<code>DB_TYPE = sqlite3<\/code>、<code>PATH = C:\\gitea\\data\\gitea.db<\/code>、<code>ROOT = C:/gitea/data/gitea-repositories<\/code>、<code>INSTALL_LOCK = true<\/code>（另外會多一行 <code>[lfs]<\/code> 的 <code>PATH<\/code>）。"], "fails": ["之後 3000 綁在 0.0.0.0：<code>HTTP_ADDR<\/code> 沒設或設錯。", "之後頁面沒有樣式：<code>ROOT_URL<\/code> 與 nginx 的 location 不一致。", "之後出現安裝精靈：<code>INSTALL_LOCK<\/code> 不是 true，或 Gitea 讀到的不是這份 <code>app.ini<\/code>。"], "why": [["第 6 步：Gitea app.ini", "rb-6"], ["app.ini 逐行說明", "cf-appini"], ["app.ini 全文", "files-appini"]], "kind": "ro", "danger": "", "env": "", "stage": "gitea-clone-and-deploy", "gate": "", "inst": [{"t": "tip", "k": "note", "h": "這一頁的事，installer 在 <code>gitea-clone-and-deploy<\/code> 已經一起做了：核對 <code>app.ini<\/code> 的關鍵設定；IP 不一致時會停下來問你。 不用再下指令。"}, {"t": "cmd", "env": "ps152", "label": "想確認的話：只檢查，不改任何東西", "code": "cd <dzlab-installer 資料夾>\n.\\install.cmd -Stage gitea-clone-and-deploy -Check", "notes": ["<code>-Check<\/code>：只跑這個階段的完成檢查，唯讀。"]}]}, "a-env": {"ch": "階段 2 · pyDMS-clone-and-prepare", "title": "把 pyDMS 的 .env 放回去", "body": ["<code>.env<\/code> 讓 pyDMS 只聽本機、知道自己的網址前綴、並信任 nginx 傳來的來源 IP。它不在 git 裡，新 clone 的資料夾不會有。"], "blocks": [{"t": "cmd", "env": "ps152", "label": "複製 .env 與 var，然後核對四行", "code": "$src = \"<備份集資料夾>\"\nCopy-Item \"$src\\pydms\\env\" C:\\pyDMS\\.env\nrobocopy \"$src\\pydms\\var\" C:\\pyDMS\\var /E /COPY:DAT /R:1 /W:1 /NP\nSelect-String -Path C:\\pyDMS\\.env -Pattern \"^\\s*NDMS_(HOST|PORT|URL_PREFIX|TRUST_PROXY|RELOAD)\\s*=\"", "notes": ["<code>Copy-Item<\/code>：複製單一檔案。<code>var\\<\/code> 裡有 <code>security.json<\/code> 等執行期資料。", "<code>Select-String<\/code>：只印出這四個 key，不會把檔案裡的密碼顯示在畫面上。", "<code>NDMS_TRUST_PROXY=1<\/code> 的前提是後端只聽 127.0.0.1。即使如此，校內的人仍可能偽造來源 IP 的標頭；這是交接書裡尚未做的安全修正，<span class=\"dflt\">預設決定（可改）<\/span> 這次不改。"]}, {"t": "cmd", "env": "ps152", "label": "檢查 .env 有沒有寫死的絕對路徑（唯讀，只印變數名稱）", "code": "Select-String -Path C:\\pyDMS\\.env -Pattern '=\\s*\"?[A-Za-z]:\\\\' | ForEach-Object { ($_.Line -split '=')[0].Trim() }", "notes": ["找出值是 <code>C:\\…<\/code> 這類絕對路徑的設定，<strong>只印出名稱，不印值<\/strong>。", "沒有任何輸出最好。有輸出的話，逐一確認那個路徑是不是指向舊資料夾。"]}, {"t": "tip", "k": "warn", "h": "<code>.env<\/code> 的完整內容 <span class=\"todo\">待補<\/span>，下表只是已知的變數名稱，這裡不列任何值。<strong>整份從舊機或備份複製，不要自己重寫<\/strong>；裡面有密碼，查看時用 <code>Select-String<\/code> 指定 key，不要整份印出來。"}, {"t": "table", "head": ["已知的變數名稱", "用途"], "rows": [["<code>NDMS_HOST<\/code>／<code>NDMS_PORT<\/code>", "監聽位址與 port"], ["<code>NDMS_URL_PREFIX<\/code>", "網址前綴，要和 nginx 的 location 一致"], ["<code>NDMS_TRUST_PROXY<\/code>", "是否信任 nginx 傳來的來源 IP"], ["<code>NDMS_IP_ALLOW<\/code>／<code>NDMS_IP_DENY<\/code>", "白名單／黑名單（選用的第三道圍籬，目前未啟用）"], ["<code>NDMS_IP_ALLOW_LOCALHOST<\/code>", "本機是否不受名單限制"], ["<code>NDMS_RESTRICTED_FEATURES<\/code>", "restricted 角色可用的功能"], ["<code>NDMS_ADMIN_ALLOW_RESTART<\/code>", "允許 root 從網頁重啟服務"], ["<code>NDMS_ADMIN_ALLOW_GIT<\/code>", "允許 root 從網頁執行 git pull 後重啟"], ["<code>NDMS_RELOAD<\/code>", "熱重載，只給開發用；正式環境必須是 0"], ["<code>NDMS_DATA_DIR<\/code>", "SQL 快取根目錄，預設在專案的 <code>data\\<\/code>"], ["密碼、簽章密鑰、SQL 連線、外部服務金鑰", "變數名稱 <span class=\"todo\">待補<\/span>"]]}], "expect": ["<code>NDMS_HOST<\/code> 是 <code>127.0.0.1<\/code>、<code>NDMS_PORT<\/code> 是 <code>8000<\/code>、<code>NDMS_URL_PREFIX<\/code> 是 <code>/pydms<\/code>、<code>NDMS_TRUST_PROXY<\/code> 是 <code>1<\/code>。", "<code>NDMS_RELOAD<\/code> 沒有出現，或是 <code>0<\/code>。", "絕對路徑檢查沒有輸出，或輸出的設定都不是指向舊資料夾。"], "fails": ["有設定指向舊資料夾：新服務會繼續讀寫舊資料夾，「舊資料夾不動」就不成立。先用記事本把那一項改成新路徑，再往下。", "少了某一行：不要自己補，回頭確認複製的是不是正確的 <code>.env<\/code>。", "之後 <code>/pydms/login<\/code> 回 404：<code>NDMS_URL_PREFIX<\/code> 沒生效。"], "why": [["第 7 步：pyDMS .env", "rb-7"], [".env 已知的 key", "cf-env"], ["還沒取得原文的檔案", "files-missing"], ["審查：X-Forwarded-For", "rv-major"]], "kind": "act", "danger": "", "env": "", "stage": "pyDMS-clone-and-prepare", "gate": "", "inst": [{"t": "tip", "k": "note", "h": "這一頁的事，installer 在 <code>pyDMS-clone-and-prepare<\/code> 已經一起做了：放 <code>.env<\/code>、檢查四個部署值與絕對路徑、複製 <code>var<\/code>。 不用再下指令。"}, {"t": "cmd", "env": "ps152", "label": "想確認的話：只檢查，不改任何東西", "code": "cd <dzlab-installer 資料夾>\n.\\install.cmd -Stage pyDMS-clone-and-prepare -Check", "notes": ["<code>-Check<\/code>：只跑這個階段的完成檢查，唯讀。"]}]}, "a-nginxconf": {"ch": "階段 4 · nginx-deploy-and-run", "title": "建立 nginx.conf", "body": ["nginx 是唯一的對外入口：它持有憑證、檢查來源 IP、再把 <code>/gitea/<\/code> 與 <code>/pydms/<\/code> 轉給後面的兩個程式。只有 <code>C:\\nginx\\conf\\nginx.conf<\/code> 這一個檔案會生效。"], "blocks": [{"t": "tip", "k": "note", "h": "X-Forwarded-For 的寫法 <span class=\"dflt\">預設決定（可改）<\/span> 照 152 的原文，這次不改。要不要改成覆寫模式是另一個決定，見下方連結。"}, {"t": "file", "key": "nginx.conf", "path": "C:\\nginx\\conf\\nginx.conf", "note": "這是 152 上目前生效的原文，連同當初寫的註解。nginx.conf 不需要轉換換行，但<strong>不能有 BOM<\/strong>。", "cenv": "ps152", "ccode": "$f = \"C:\\nginx\\conf\\nginx.conf\"\n$t = [System.IO.File]::ReadAllText($f)\n[System.IO.File]::WriteAllText($f, $t, (New-Object System.Text.UTF8Encoding $false))   # 去掉可能的 BOM\ncd C:\\nginx\n.\\nginx.exe -t", "cnote": "前三行把檔案重寫成沒有 BOM 的 UTF-8（較舊的記事本存「UTF-8」會加 BOM，nginx 會讀不到第一行）。<code>-t<\/code> 只檢查語法與憑證，不會啟動 nginx。"}, {"t": "tip", "k": "warn", "h": "這一步不要直接執行 <code>.\\nginx.exe<\/code> 啟動，否則會留下不受服務管理的行程。啟動交給後面「註冊服務」那一步。"}], "expect": ["<code>-t<\/code> 印出 <code>syntax is ok<\/code> 與 <code>test is successful<\/code>。"], "fails": ["訊息指出第 1 行有問題（例如 unknown directive）：檔案還帶著 BOM，把檢查指令的前三行再執行一次。", "<code>cannot load certificate<\/code>：憑證的檔名或路徑不對，回上一章。", "其他錯誤：訊息會指出檔名與行號，常見是少分號或大括號沒配對，重新貼一次全文。"], "why": [["第 8 步：nginx.conf", "rb-8"], ["nginx.conf 逐行說明", "cf-nginx"], ["存檔的編碼與換行", "files-save"], ["審查：X-Forwarded-For", "rv-major"]], "kind": "act", "danger": "", "env": "", "stage": "nginx-deploy-and-run", "gate": "", "inst": [{"t": "tip", "k": "note", "h": "這一頁的事，installer 在 <code>nginx-deploy-and-run<\/code> 已經一起做了：依範本產生 <code>nginx.conf<\/code>（沒有 BOM），先測試再換上。 不用再下指令。"}, {"t": "cmd", "env": "ps152", "label": "想確認的話：只檢查，不改任何東西", "code": "cd <dzlab-installer 資料夾>\n.\\install.cmd -Stage nginx-deploy-and-run -Check", "notes": ["<code>-Check<\/code>：只跑這個階段的完成檢查，唯讀。"]}]}, "a-jump": {"ch": "階段 4 · nginx-deploy-and-run", "title": "放回首頁的導覽頁 jump_page.html", "body": ["打開 <code>https://140.112.180.152/<\/code> 看到的那一頁，就是 <code>C:\\nginx\\html\\jump_page.html<\/code>。"], "blocks": [{"t": "cmd", "env": "ps152", "label": "從舊機的副本複製", "code": "$src = \"<備份集資料夾>\"\nCopy-Item \"$src\\nginx\\html\\jump_page.html\" C:\\nginx\\html\\jump_page.html\nTest-Path C:\\nginx\\html\\jump_page.html", "notes": ["<code>Copy-Item<\/code>：複製單一檔案。最後一行確認檔案到位。"]}, {"t": "tip", "k": "warn", "h": "<code>jump_page.html<\/code> 的原文 <span class=\"todo\">待補<\/span>，這份導覽沒有它的內容。請從舊機複製；沒有的話先用下面的範例頂著，之後補上。"}, {"t": "alt", "title": "沒有舊的導覽頁：先建立一個最簡單的版本（這是範例，不是原文）", "blocks": [{"t": "cmd", "env": "ps152", "label": "建立範例導覽頁（UTF-8 無 BOM）", "code": "$content = @\"\n<!DOCTYPE html>\n<html><head><meta charset=\"utf-8\"><title>152 Server<\/title><\/head>\n<body><h1>152 Server<\/h1><p>服務入口: <a href=\"/pydms/\">pyDMS<\/a> / <a href=\"/gitea/\">Gitea<\/a><\/p><\/body>\n<\/html>\n\"@\n[System.IO.File]::WriteAllText(\"C:\\nginx\\html\\jump_page.html\", $content, (New-Object System.Text.UTF8Encoding $false))", "notes": ["<code>@\" … \"@<\/code> 是 PowerShell 的多行文字寫法。<code>WriteAllText … UTF8Encoding $false<\/code>：寫成 UTF-8、不加 BOM。", "這只是能用的最小範例，和 152 上原本的頁面不同。"]}]}], "expect": ["<code>Test-Path<\/code> 印出 <code>True<\/code>。"], "fails": ["之後打開首頁是 404：<code>jump_page.html<\/code> 不在 <code>C:\\nginx\\html\\<\/code>，或檔名打錯。"], "why": [["第 8 步：導覽頁", "rb-8"], ["還沒取得原文的檔案", "files-missing"]], "kind": "act", "danger": "", "env": "", "stage": "nginx-deploy-and-run", "gate": "", "inst": [{"t": "tip", "k": "note", "h": "這一頁的事，installer 在 <code>nginx-deploy-and-run<\/code> 已經一起做了：還原首頁；備份集裡沒有的話放一份範例。 不用再下指令。"}, {"t": "cmd", "env": "ps152", "label": "想確認的話：只檢查，不改任何東西", "code": "cd <dzlab-installer 資料夾>\n.\\install.cmd -Stage nginx-deploy-and-run -Check", "notes": ["<code>-Check<\/code>：只跑這個階段的完成檢查，唯讀。"]}]}, "pydms-script": {"ch": "階段 5 · nssm-service-build", "title": "建立 install_pydms_service.bat", "body": ["手動做法用這支腳本註冊 python-dms 服務。它是 2026-11-24 新寫的，舊機上不會有。它有「只檢查、不改任何東西」的 check 模式。", "這支腳本還沒有在 152 上實際執行過，第一次跑請留意畫面。"], "blocks": [{"t": "file", "key": "scripts/install_pydms_service.bat", "path": "C:\\scripts\\install_pydms_service.bat", "note": "設定區在檔案開頭，預設資料夾就是 <code>C:\\pyDMS<\/code>，不用改。開頭有兩行 <code>@echo off<\/code> 是刻意的，不要刪。", "cenv": "ps152", "ccode": "Get-Content C:\\scripts\\install_pydms_service.bat -TotalCount 5 -Encoding UTF8", "cnote": "印出檔案前 5 行，確認存到了對的位置、中文沒有變成亂碼。"}, {"t": "cmd", "env": "ps152", "label": "存好後：轉成 CRLF、UTF-8 無 BOM", "code": "$f = \"C:\\scripts\\install_pydms_service.bat\"\n$t = [System.IO.File]::ReadAllText($f)\n$t = $t -replace \"`r?`n\", \"`r`n\"                                          # 先把所有換行統一成 LF，再全部換成 CRLF，不會變成兩個 CR\n[System.IO.File]::WriteAllText($f, $t, (New-Object System.Text.UTF8Encoding $false))   # $false＝不加 BOM\n(Get-Content $f -Raw) -match \"`r`n\"                                       # 應該印出 True", "notes": ["<code>.bat<\/code> 用到 <code>goto<\/code> 與標籤，從網頁貼上的文字換行可能只有 LF，cmd 在某些情況下會找不到標籤，所以手動貼上的 <code>.bat<\/code> 都要轉一次。", "最後一行印出 <code>True<\/code> 才算完成。"]}], "expect": ["前 5 行看得到兩行 <code>@echo off<\/code> 與 <code>chcp 65001 &gt;nul<\/code>。", "轉換指令最後印出 <code>True<\/code>。"], "fails": ["中文變成亂碼：存檔時編碼沒有選 UTF-8，重新另存一次。", "之後執行時最上面出現一行「不是內部或外部命令」：檔案帶了 BOM，沒有影響（第二行 <code>@echo off<\/code> 就是為了這件事）。"], "why": [["python-dms 的註冊與移除腳本", "cf-svc-new"], ["存檔的編碼與換行", "files-save"]], "kind": "act", "danger": "", "env": "", "stage": "nssm-service-build", "gate": "nginx-deploy-and-run", "inst": [{"t": "cmd", "env": "ps152", "label": "執行階段 5", "code": "cd <dzlab-installer 資料夾>\n.\\install.cmd -Stage nssm-service-build", "notes": ["它會：把 pyDMS 的來源改成 https 網址 → 在 <code>C:\\scripts<\/code> 產生手動備援用的腳本 → 問你一次（輸入 <code>YES<\/code>）→ 停舊服務、移除、用 <code>C:\\pyDMS<\/code> 註冊、啟動 → 檢查。", "執行前先<strong>關閉所有「服務」管理視窗<\/strong>；開著的話舊服務可能移除不掉，它會停下來提醒你。", "中途失敗時，它會用記下的舊設定把原本的服務建回來，不會讓 pyDMS 停著。", "服務已經存在而且設定完全相同時，它什麼都不做，不會多中斷一次。", "<span class=\"dflt\">預設決定（可改）<\/span>：網頁上的 git 更新要是關的（<code>NDMS_ADMIN_ALLOW_GIT<\/code>）。開著的話它會停下來說明，請你自己關掉再重跑。"]}]}, "a-otherscripts": {"ch": "階段 5 · nssm-service-build", "title": "補齊日常會用到的其他腳本", "body": ["這三支現在不會執行，先放好，之後維護時才找得到。"], "blocks": [{"t": "alt", "title": "uninstall_pydms_service.bat：停止並移除 python-dms 服務（不刪任何資料）", "blocks": [{"t": "file", "key": "scripts/uninstall_pydms_service.bat", "path": "C:\\scripts\\uninstall_pydms_service.bat", "note": "新腳本，還沒有在 152 上實際執行過。", "cenv": "ps152", "ccode": "Get-Content C:\\scripts\\uninstall_pydms_service.bat -TotalCount 5 -Encoding UTF8", "cnote": "印出檔案前 5 行，確認存到了對的位置、中文沒有變成亂碼。"}, {"t": "cmd", "env": "ps152", "label": "存好後：轉成 CRLF、UTF-8 無 BOM", "code": "$f = \"C:\\scripts\\uninstall_pydms_service.bat\"\n$t = [System.IO.File]::ReadAllText($f)\n$t = $t -replace \"`r?`n\", \"`r`n\"                                          # 先把所有換 llow | ForEach-Object {\n  $a = $_ | Get-NetFirewallAddressFilter\n  if ($a.RemoteAddress -contains 'Any') {\n    [pscustomobject]@{ Name=$_.DisplayName; Port=($_ | Get-NetFirewallPortFilter).LocalPort\n                       Program=($_ | Get-NetFirewallApplicationFilter).Program }\n  }\n} | Format-Table -AutoSize -Wrap", "notes": ["不篩 port。只指定程式、不指定 port 的規則也會列出來：例如有人第一次手動執行 <code>nginx.exe<\/code> 或 <code>python.exe<\/code> 時，在 Windows 跳出的視窗按了「允許存取」。", "防火牆是「任何一條允許成立就放行」。這裡如果有 <code>nginx.exe<\/code> 或 <code>python.exe<\/code> 的規則，後面把 443 收緊也沒有用。", "需要跑一陣子。"]}, {"t": "tip", "k": "warn", "h": "接下來幾頁全程<strong>不要動 3389（遠端桌面）的規則<\/strong>，並保持遠端桌面連線不要中斷。"}], "expect": ["全新的機器：通常只看到 3389 的規則。", "原本的 152：會看到 <code>Nginx HTTPS (443)<\/code>（Remote 是 Any）、<code>Gitea-Allowed-IPs<\/code>（3000）、<code>FastAPI-Restricted-Access<\/code>（8000），沒有 80 的規則。"], "fails": ["什麼都沒印：沒有符合的啟用規則，當成全新的機器繼續。"], "why": [["第 10 步：防火牆規則", "rb-10"], ["防火牆規則現況與目標", "cf-fw"], ["審查：重要問題", "rv-major"]], "kind": "ro", "danger": "", "env": "", "stage": "firewall-tighten", "gate": "", "inst": [{"t": "cmd", "env": "ps152", "label": "用 installer 做整條路線", "code": "cd <dzlab-installer 資料夾>\n.\\install.cmd -Action firewall-tighten", "notes": ["它會：印出現況 → 處理 80 → 處理 443 → <strong>停下來請你從校內電腦測一次<\/strong> → 你回答正常才停用 3000 與 8000 的舊規則。", "它不碰 3389，也不碰連出規則。舊規則只停用、不刪除。", "這個動作是建議新增的，installer 是否已包含 <span class=\"todo\">待補：待確認<\/span>。"]}]}, "fw-80": {"ch": "防火牆收尾", "title": "新增 80 埠的規則，只允許校內三個網段", "body": ["80 埠的存取控制<strong>只靠這一條防火牆規則<\/strong>。nginx.conf 裡 80 的 allow／deny 其實無效，因為轉址（<code>return 301<\/code>）比 allow／deny 先執行。"], "blocks": [{"t": "cmd", "env": "ps152", "label": "新增 80 的規則", "code": "$campus = \"140.112.46.0/24\",\"140.112.180.0/24\",\"140.112.92.0/24\"\nNew-NetFirewallRule -DisplayName \"Nginx HTTP (80)\" -Direction Inbound -Protocol TCP -LocalPort 80 `\n  -Action Allow -Profile Any -RemoteAddress $campus", "notes": ["<code>New-NetFirewallRule<\/code>：新增一條規則。<code>-Direction Inbound<\/code> 連入；<code>-LocalPort<\/code> 這台機器上的 port；<code>-Action Allow<\/code> 放行；<code>-Profile Any<\/code> 三種網路設定檔都適用。", "<code>-RemoteAddress $campus<\/code>：只有這三個校內網段適用。<strong>不要設成 Any。<\/strong>"]}], "expect": ["印出新規則的內容，<code>DisplayName<\/code> 是 <code>Nginx HTTP (80)<\/code>、<code>Enabled<\/code> 是 <code>True<\/code>。"], "fails": ["上一頁已經看到同名的規則：不要再新增一條，改用 <code>Set-NetFirewallRule -DisplayName \"Nginx HTTP (80)\" -RemoteAddress $campus<\/code>。", "「存取被拒」：PowerShell 不是用系統管理員身分開的。"], "why": [["80 的 allow／deny 為什麼無效", "cc-phase"], ["防火牆規則", "cf-fw"]], "kind": "act", "danger": "", "env": "", "stage": "firewall-tighten", "gate": "", "inst": [{"t": "tip", "k": "note", "h": "用 installer 的話，這一頁已經包含在 <code>firewall-tighten<\/code> 裡。"}]}, "fw-443": {"ch": "防火牆收尾", "title": "讓 443 埠也只允許校內三個網段", "body": ["443 是 HTTPS 的入口。原本的 152 已經有一條來源是 Any 的規則，要把它收緊；全新的機器則是新增。照第一頁查到的結果，二選一。"], "blocks": [{"t": "cmd", "env": "ps152", "label": "情況一：查詢時沒有 443 的規則（全新機器）", "code": "$campus = \"140.112.46.0/24\",\"140.112.180.0/24\",\"140.112.92.0/24\"\nNew-NetFirewallRule -DisplayName \"Nginx HTTPS (443)\" -Direction Inbound -Protocol TCP -LocalPort 443 `\n  -Action Allow -Profile Any -RemoteAddress $campus", "notes": ["和 80 的寫法相同，只是 port 換成 443。"]}, {"t": "alt", "title": "情況二：已經有「Nginx HTTPS (443)」這條規則（原本的 152）", "blocks": [{"t": "cmd", "env": "ps152", "label": "把來源從 Any 改成校內", "code": "$campus = \"140.112.46.0/24\",\"140.112.180.0/24\",\"140.112.92.0/24\"\nSet-NetFirewallRule -DisplayName \"Nginx HTTPS (443)\" -RemoteAddress $campus", "notes": ["<code>Set-NetFirewallRule<\/code>：修改既有的規則，這裡只改允許的來源位址。", "這條指令在 152 上屬於待辦，還沒有執行過。"]}]}, {"t": "cmd", "env": "ps152", "label": "做完後確認兩條規則（唯讀）", "code": "Get-NetFirewallRule -DisplayName \"Nginx*\" | ForEach-Object {\n  $_.DisplayName; ($_ | Get-NetFirewallAddressFilter).RemoteAddress\n}", "notes": ["印出名稱以 Nginx 開頭的規則，以及各自允許的來源位址。"]}], "expect": ["<code>Nginx HTTP (80)<\/code> 與 <code>Nginx HTTPS (443)<\/code> 底下都只列出三個網段：<code>140.112.46.0/24<\/code>、<code>140.112.180.0/24<\/code>、<code>140.112.92.0/24<\/code>。"], "fails": ["443 底下還是 <code>Any<\/code>：情況二的指令沒有生效，確認規則名稱完全相同。", "443 出現兩條規則：兩種情況都做了。刪掉來源是 Any 的那一條之前，先找負責人確認。"], "why": [["第 10 步：防火牆規則", "rb-10"], ["防火牆規則現況與目標", "cf-fw"]], "kind": "act", "danger": "", "env": "", "stage": "firewall-tighten", "gate": "", "inst": [{"t": "tip", "k": "note", "h": "用 installer 的話，這一頁已經包含在 <code>firewall-tighten<\/code> 裡。"}]}, "fw-test": {"ch": "防火牆收尾", "title": "馬上從校內電腦確認還連得上", "body": ["改完防火牆要立刻測，確定沒有把校內的人也擋在外面。"], "blocks": [{"t": "cmd", "env": "mech", "label": "在機械系電腦的 PowerShell 執行", "code": "curl.exe -k -s -o NUL -w \"https %{http_code}`n\" --max-time 8 https://140.112.180.152/\ncurl.exe -s -o NUL -w \"http  %{http_code}`n\" --max-time 8 http://140.112.180.152/", "notes": ["<code>curl.exe<\/code>：一定要寫 <code>.exe<\/code>，在 Windows PowerShell 裡 <code>curl<\/code> 是另一個指令的別名。", "<code>-k<\/code> 接受自簽憑證；<code>-s -o NUL -w \"%{http_code}\"<\/code> 只印狀態碼；<code>--max-time 8<\/code> 最多等 8 秒。"]}], "expect": ["<code>https 200<\/code>。", "<code>http  301<\/code>（被轉到 https）。"], "fails": ["兩個都是 <code>000<\/code>（逾時）：規則沒建成、網段打錯，或這台電腦其實不在三個網段內（在那台電腦查自己的對外 IP）。", "<code>https 403<\/code>：連得到，但被 nginx 擋下，代表這台電腦的 IP 不在 nginx.conf 的 allow 清單裡。"], "why": [["錯誤訊息怎麼判讀", "cc-errors"], ["第 10 步：驗證", "rb-10"]], "kind": "ro", "danger": "", "env": "", "stage": "firewall-tighten", "gate": "", "inst": [{"t": "tip", "k": "note", "h": "用 installer 的話，這一頁已經包含在 <code>firewall-tighten<\/code> 裡。"}]}, "fw-disable": {"ch": "防火牆收尾", "title": "停用 3000 與 8000 的舊規則", "body": ["後端已經只聽 127.0.0.1，這兩條舊規則用不到了。先停用、不刪，觀察一週沒問題再刪。", "<strong>全新的機器沒有這兩條規則，這一頁直接按下一步。<\/strong>"], "blocks": [{"t": "cmd", "env": "ps152", "label": "停用兩條舊規則（只有原本的 152 需要）", "code": "Disable-NetFirewallRule -DisplayName \"Gitea-Allowed-IPs\"               # 3000：先停用，不刪\nDisable-NetFirewallRule -DisplayName \"FastAPI-Restricted-Access\"       # 8000：先停用，不刪", "notes": ["<code>Disable-NetFirewallRule<\/code>：把規則關掉但保留。", "這兩條指令在 152 上屬於待辦，還沒有執行過。", "只改連入規則。pyDMS 需要對外連線（外部服務、SQL），連出規則不要動。"]}, {"t": "alt", "title": "一週後沒有問題：刪除這兩條規則", "blocks": [{"t": "cmd", "env": "ps152", "label": "一週後才做", "code": "Remove-NetFirewallRule -DisplayName \"Gitea-Allowed-IPs\"\nRemove-NetFirewallRule -DisplayName \"FastAPI-Restricted-Access\"", "notes": ["<code>Remove-NetFirewallRule<\/code>：永久刪除規則。刪了就要重新建立才回得來。"]}]}], "expect": ["指令沒有任何輸出，代表成功。"], "fails": ["<code>No MSFT_NetFirewallRule objects found<\/code>：這台沒有這條規則，不用處理。"], "why": [["防火牆規則現況與目標", "cf-fw"], ["殘留效果", "cc-residue"]], "kind": "act", "danger": "這一步會<strong>停用<\/strong>兩條防火牆規則。不影響 3389，也不影響 80／443。退路：<code>Enable-NetFirewallRule -DisplayName \"規則名稱\"<\/code> 就能開回來，所以這裡只停用、不刪除。", "env": "", "stage": "firewall-tighten", "gate": "", "inst": [{"t": "tip", "k": "note", "h": "用 installer 的話，這一頁已經包含在 <code>firewall-tighten<\/code> 裡。"}]}, "a-remote": {"ch": "階段 5 · nssm-service-build", "title": "把 pyDMS 的來源改成 https 網址，手動拉一次", "body": ["前面是從備份集裡的倉庫直接 clone 的。現在 Gitea 與 nginx 都起來了，把來源改成 Gitea 的 https 網址，和其他電腦一樣。", "接著手動拉一次，確認上一頁寫進 <code>.env<\/code> 的帳號與權杖是對的，再重啟服務讓 <code>.env<\/code> 生效。這是最後一次手動輸入帳密。"], "blocks": [{"t": "cmd", "env": "ps152", "label": "改 remote、手動拉一次（帳號填專用帳號，密碼欄貼權杖）、重啟服務", "code": "cd C:\\pyDMS\ngit remote -v                                                   # 先看現在的 remote\ngit remote set-url origin https://140.112.180.152/gitea/DZLab/pyDMS.git\ngit config --local http.sslVerify false                         # 只對這個 repo 接受自簽憑證\ngit -c credential.helper= pull --ff-only                        # 帳號填專用帳號，密碼欄貼權杖\nC:\\nssm\\win64\\nssm.exe restart python-dms                       # 讓服務讀到 .env 的新設定", "notes": ["<code>git remote set-url origin &lt;網址&gt;<\/code>：修改既有的 remote。網址裡不放帳號，也不放權杖；帳號由 <code>.env<\/code> 提供。", "<code>git config --local http.sslVerify false<\/code>：152 的憑證是自簽的，Windows 不信任它，不關掉驗證會出現 <code>schannel: SEC_E_UNTRUSTED_ROOT<\/code>。<code>--local<\/code> 只影響這一個資料夾，不要用 <code>--global<\/code>。", "<code>-c credential.helper=<\/code>：這一次不使用 Windows 的認證管理工具，改由終端機直接問帳號與密碼。密碼欄貼上權杖，輸入時不會顯示字元。", "<code>--ff-only<\/code>：只在可以直接往前接的時候才更新，不會硬合併。", "<code>nssm restart python-dms<\/code>：重啟的幾秒內 <code>/pydms/<\/code> 會回 502。"]}, {"t": "tip", "k": "note", "h": "之後更新 pyDMS 的程式不用再這樣手動輸入：pyDMS 會用 <code>.env<\/code> 那組帳號自己檢查 Gitea 有沒有新版，系統設定裡的「git 更新」也用同一組。下一頁在網頁上確認。"}], "expect": ["<code>git remote -v<\/code> 之後顯示的是 https 網址，裡面沒有帳號。", "<code>git pull<\/code> 回 <code>Already up to date.<\/code>，或有進度條。", "服務重啟後是 <code>Running<\/code>。"], "fails": ["<code>SEC_E_UNTRUSTED_ROOT<\/code> 或 <code>SSL certificate problem<\/code>：少了 <code>http.sslVerify false<\/code> 那一行。", "404 或 <code>repository not found<\/code>：專用帳號沒有讀取權，或網址大小寫打錯。", "跳出瀏覽器，開到 <code>/login/oauth/authorize<\/code> 然後 404：少了 <code>-c credential.helper=<\/code>。"], "why": [["git remote 的做法（已決定）", "rb-remote"], ["152 拉程式碼用的認證（已決定）", "gg-deploy-auth"], ["2026-11-25 自動更新失敗的經過", "incident-1125"], ["SEC_E_UNTRUSTED_ROOT", "faq-untrusted"]], "kind": "act", "danger": "", "env": "", "stage": "nssm-service-build", "gate": "", "inst": [{"t": "tip", "k": "note", "h": "installer 在 <code>nssm-service-build<\/code> 會把 origin 改成 https 網址（只改設定）。手動拉一次與重啟服務還是要自己做：切到「手動做法」，執行最後兩行。"}, {"t": "cmd", "env": "ps152", "label": "想確認的話：只檢查，不改任何東西", "code": "cd <dzlab-installer 資料夾>\n.\\install.cmd -Stage nssm-service-build -Check", "notes": ["<code>-Check<\/code>：只跑這個階段的完成檢查，唯讀。"]}]}, "b-prep": {"ch": "階段 1 · env-set-up", "title": "記下現況，並讓 installer 認識這台機器", "body": ["這條路線只把 pyDMS 換到新資料夾 <code>C:\\pyDMS<\/code>，Gitea 與 nginx 都不動。舊資料夾全程不會被改，它就是你的退路。"], "blocks": [{"t": "cmd", "env": "ps152", "label": "查詢（唯讀）", "code": "C:\\nssm\\win64\\nssm.exe get python-dms AppDirectory\nGet-Service gitea, nginx, python-dms | Select-Object Name, Status\npy -3.11 -c \"import sys; print(sys.executable)\"", "notes": ["第一行印出 python-dms 服務目前指向的資料夾。<strong>把它記下來<\/strong>，後面複製 <code>.env<\/code> 與退回時都要用。", "第二行確認三個服務現在都活著。第三行確認有 Python 3.11，以及它裝在哪裡。"]}, {"t": "cmd", "env": "ps152", "label": "看網頁上的 git 更新有沒有開（唯讀；把 <舊資料夾> 換成上面查到的路徑）", "code": "Select-String -Path \"<舊資料夾>\\.env\" -Pattern \"^\\s*NDMS_ADMIN_ALLOW_GIT\\s*=\"", "notes": ["只印出這一個設定。它不是機密。", "有開的話要先知道：換到新資料夾並改用 https 之後，這個功能很可能失效（服務以系統帳號執行，沒有認證）。<span class=\"dflt\">預設決定（可改）<\/span> 是把它關掉，改由管理員手動更新。"]}], "expect": ["印出一個資料夾路徑（舊資料夾）。", "三個服務都是 <code>Running<\/code>。", "Python 3.11 的位置不在 <code>C:\\Users\\<\/code> 底下；在的話先記下來 <span class=\"todo\">待補：待確認是否要重裝<\/span>。"], "fails": ["<code>nssm get<\/code> 說找不到服務：python-dms 還沒註冊過，這台比較接近全新機器，改走路線 A。"], "why": [["審查對三條路線的結論", "rv-routes"], ["目前名稱與目標名稱", "ov-names"], ["installer 的階段", "ig-stages"]], "kind": "ro", "danger": "", "env": "", "stage": "env-set-up", "gate": "", "inst": [{"t": "cmd", "env": "ps152", "label": "執行階段 1", "code": "cd <dzlab-installer 資料夾>\n.\\install.cmd -Stage env-set-up", "notes": ["情境選 <code>existing-machine<\/code>（已在運作的機器）。其他欄位通常按 Enter 用預設值。", "它會記下目前 python-dms 指向的資料夾、三個服務的帳號與狀態，並檢查 Git、Python、防火牆。", "這個階段不會停任何服務。"]}]}, "b-clone": {"ch": "階段 2 · pyDMS-clone-and-prepare", "title": "把 pyDMS clone 到 C:\\pyDMS", "body": ["從 Gitea 取得一份全新的程式碼，放在新資料夾。這不會動到舊資料夾。"], "blocks": [{"t": "cmd", "env": "ps152", "label": "clone（會問帳號與密碼：帳號填專用帳號，密碼貼權杖）", "code": "cd C:\\\ngit -c http.sslVerify=false -c credential.helper= clone https://140.112.180.152/gitea/DZLab/pyDMS.git\ncd C:\\pyDMS\ngit config --local http.sslVerify false                           # 只對這個 repo 接受自簽憑證\ngit status -sb                                                    # 應顯示 ## master...origin/master，沒有任何修改\ngit log -1 --format=\"%h %ci %s\"                                   # 最新一筆 commit", "notes": ["<code>-c http.sslVerify=false<\/code>：152 的憑證是自簽的，Windows 不信任它，不加會出現 <code>schannel: SEC_E_UNTRUSTED_ROOT<\/code>。<code>-c<\/code> 只對這一次指令生效。", "<code>-c credential.helper=<\/code>：不使用 Windows 的認證管理工具，改由終端機直接問。<strong>密碼欄貼上 Personal Access Token<\/strong>，輸入時不會顯示字元。", "<code>git config --local http.sslVerify false<\/code>：讓這個資料夾之後的 pull 也跳過憑證驗證，只影響這一個 repo。"]}, {"t": "tip", "k": "note", "h": "這次 clone 還是要手動輸入帳密，因為新資料夾還沒有 <code>.env<\/code>。放好 <code>.env<\/code>、寫進專用帳號之後，就由 pyDMS 自己帶帳號，不用再輸入。"}], "expect": ["<code>git status -sb<\/code> 顯示 <code>## master...origin/master<\/code>，底下沒有任何修改。", "<code>git log -1<\/code> 印出預期的最新 commit。"], "fails": ["<code>SEC_E_UNTRUSTED_ROOT<\/code>：忘了 <code>-c http.sslVerify=false<\/code>。", "404 或 <code>repository not found<\/code>：帳號沒有讀取權，或網址大小寫寫錯。跳出瀏覽器：沒有加 <code>-c credential.helper=<\/code>。", "「目的地已存在」：上次做到一半。先看 <code>C:\\pyDMS<\/code> 裡是什麼，不要直接刪；分支名稱也可能是 <code>main<\/code> <span class=\"todo\">待補：待確認<\/span>。"], "why": [["第 4 步：取得 pyDMS 程式碼", "rb-4"], ["SEC_E_UNTRUSTED_ROOT", "faq-untrusted"], ["git 對自簽憑證的取捨", "dec-gitssl"]], "kind": "act", "danger": "", "env": "", "stage": "pyDMS-clone-and-prepare", "gate": "env-set-up", "inst": [{"t": "cmd", "env": "ps152", "label": "執行階段 2", "code": "cd <dzlab-installer 資料夾>\n.\\install.cmd -Stage pyDMS-clone-and-prepare", "notes": ["已在運作的機器，程式來源預設是 <code>https<\/code>：從這台自己的 Gitea clone。git 會在視窗裡直接問帳號與密碼，<strong>密碼貼權杖<\/strong>；installer 不經手。", "它會：clone 到 <code>C:\\pyDMS<\/code> → 建 <code>.venv<\/code> → 安裝套件 → 從舊資料夾複製 <code>.env<\/code> → 檢查 <code>.env<\/code>（含絕對路徑）→ 複製 <code>var<\/code>。", "<code>.env<\/code> 裡有設定指向舊資料夾時，它會停下來列出設定名稱。", "這個階段不會動到正在運作的服務與舊資料夾。"]}]}, "b-env": {"ch": "階段 2 · pyDMS-clone-and-prepare", "title": "把舊資料夾的 .env 複製過來", "body": ["<code>.env<\/code> 不在 git 裡，新 clone 的資料夾不會有。從舊資料夾整份複製，不要重寫。"], "blocks": [{"t": "cmd", "env": "ps152", "label": "複製 .env 並核對四行（先把第一行改成記下的舊資料夾）", "code": "$old = \"<舊資料夾路徑>\"\nCopy-Item \"$old\\.env\" C:\\pyDMS\\.env\nSelect-String -Path C:\\pyDMS\\.env -Pattern \"^\\s*NDMS_(HOST|PORT|URL_PREFIX|TRUST_PROXY|RELOAD)\\s*=\"", "notes": ["<code>Copy-Item<\/code>：複製單一檔案，舊資料夾的那一份不會被動到。", "<code>Select-String<\/code>：只印出這四個 key，不會把檔案裡的密碼顯示在畫面上。"]}, {"t": "cmd", "env": "ps152", "label": "檢查 .env 有沒有寫死的絕對路徑（唯讀，只印變數名稱）", "code": "Select-String -Path C:\\pyDMS\\.env -Pattern '=\\s*\"?[A-Za-z]:\\\\' | ForEach-Object { ($_.Line -split '=')[0].Trim() }", "notes": ["找出值是 <code>C:\\…<\/code> 這類絕對路徑的設定，<strong>只印出名稱，不印值<\/strong>。", "沒有任何輸出最好。有輸出的話，逐一確認那個路徑是不是指向舊資料夾。"]}, {"t": "tip", "k": "warn", "h": "<code>.env<\/code> 的完整內容 <span class=\"todo\">待補<\/span>，下表只是已知的變數名稱，這裡不列任何值。<strong>整份從舊機或備份複製，不要自己重寫<\/strong>；裡面有密碼，查看時用 <code>Select-String<\/code> 指定 key，不要整份印出來。"}, {"t": "table", "head": ["已知的變數名稱", "用途"], "rows": [["<code>NDMS_HOST<\/code>／<code>NDMS_PORT<\/code>", "監聽位址與 port"], ["<code>NDMS_URL_PREFIX<\/code>", "網址前綴，要和 nginx 的 location 一致"], ["<code>NDMS_TRUST_PROXY<\/code>", "是否信任 nginx 傳來的來源 IP"], ["<code>NDMS_IP_ALLOW<\/code>／<code>NDMS_IP_DENY<\/code>", "白名單／黑名單（選用的第三道圍籬，目前未啟用）"], ["<code>NDMS_IP_ALLOW_LOCALHOST<\/code>", "本機是否不受名單限制"], ["<code>NDMS_RESTRICTED_FEATURES<\/code>", "restricted 角色可用的功能"], ["<code>NDMS_ADMIN_ALLOW_RESTART<\/code>", "允許 root 從網頁重啟服務"], ["<code>NDMS_ADMIN_ALLOW_GIT<\/code>", "允許 root 從網頁執行 git pull 後重啟"], ["<code>NDMS_RELOAD<\/code>", "熱重載，只給開發用；正式環境必須是 0"], ["<code>NDMS_DATA_DIR<\/code>", "SQL 快取根目錄，預設在專案的 <code>data\\<\/code>"], ["密碼、簽章密鑰、SQL 連線、外部服務金鑰", "變數名稱 <span class=\"todo\">待補<\/span>"]]}], "expect": ["<code>NDMS_HOST<\/code> 是 <code>127.0.0.1<\/code>、<code>NDMS_PORT<\/code> 是 <code>8000<\/code>、<code>NDMS_URL_PREFIX<\/code> 是 <code>/pydms<\/code>、<code>NDMS_TRUST_PROXY<\/code> 是 <code>1<\/code>。", "<code>NDMS_RELOAD<\/code> 沒有出現，或是 <code>0<\/code>。", "絕對路徑檢查沒有輸出，或輸出的設定都不是指向舊資料夾。"], "fails": ["有設定指向舊資料夾：新服務會繼續讀寫舊資料夾，「舊資料夾不動」就不成立。先用記事本把那一項改成新路徑，再往下。", "少了某一行：不要自己補，回頭確認複製的是不是正確的 <code>.env<\/code>。", "之後 <code>/pydms/login<\/code> 回 404：<code>NDMS_URL_PREFIX<\/code> 沒生效。"], "why": [[".env 與其他不在 git 裡的東西", "rb-4"], [".env 已知的 key", "cf-env"]], "kind": "act", "danger": "", "env": "", "stage": "pyDMS-clone-and-prepare", "gate": "", "inst": [{"t": "tip", "k": "note", "h": "這一頁的事，installer 在 <code>pyDMS-clone-and-prepare<\/code> 已經一起做了：複製 <code>.env<\/code>，檢查四個部署值與絕對路徑。 不用再下指令。"}, {"t": "cmd", "env": "ps152", "label": "想確認的話：只檢查，不改任何東西", "code": "cd <dzlab-installer 資料夾>\n.\\install.cmd -Stage pyDMS-clone-and-prepare -Check", "notes": ["<code>-Check<\/code>：只跑這個階段的完成檢查，唯讀。"]}]}, "b-data": {"ch": "階段 2 · pyDMS-clone-and-prepare", "title": "把 var 也搬過來", "body": ["<code>var<\/code> 裡有 <code>security.json<\/code>，存的是 root 在網頁上改過的白名單等設定，它的優先順序高於 <code>.env<\/code>。不搬的話，這些設定會無聲無息地回到 <code>.env<\/code> 的值，存取範圍可能就這樣放寬了。", "<span class=\"dflt\">預設決定（可改）<\/span>：搬。"], "blocks": [{"t": "cmd", "env": "ps152", "label": "複製 var（先把第一行改成舊資料夾）", "code": "$old = \"<舊資料夾路徑>\"\nrobocopy \"$old\\var\" C:\\pyDMS\\var /E /COPY:DAT /R:1 /W:1 /NP\nTest-Path C:\\pyDMS\\var\\security.json", "notes": ["只複製，不會動到舊資料夾。摘要的 <code>FAILED<\/code> 是 0 就是成功。", "最後一行看有沒有 <code>security.json<\/code>；舊資料夾本來就沒有的話會是 <code>False<\/code>，屬正常。"]}, {"t": "table", "head": ["其他不在 git 裡的資料夾", "要不要搬"], "rows": [["<code>data\\<\/code>（SQL 快取）", "<span class=\"todo\">待補：待決定<\/span>。先不搬，它在備份集的 <code>pydms\\full<\/code> 裡"], ["<code>runs\\<\/code>", "<span class=\"todo\">待補：待決定<\/span>。同上"], ["<code>logs\\<\/code>", "不用搬，註冊服務時會自己建立"], ["五個被 git 忽略、看起來像程式碼的資料夾", "新倉庫是否已包含 <span class=\"todo\">待補<\/span>。<strong>確認之前舊資料夾不要刪<\/strong>"]]}], "expect": ["robocopy 的 <code>FAILED<\/code> 是 0。"], "fails": ["之後新服務的啟動訊息和舊的不一樣（例如少了「有網頁覆蓋值」那一類訊息，實際字樣 <span class=\"todo\">待補：待確認<\/span>）：<code>var<\/code> 沒有搬成功。"], "why": [[".env 與其他不在 git 裡的東西", "rb-4"], ["審查：重要問題", "rv-major"]], "kind": "act", "danger": "", "env": "", "stage": "pyDMS-clone-and-prepare", "gate": "", "inst": [{"t": "tip", "k": "note", "h": "這一頁的事，installer 在 <code>pyDMS-clone-and-prepare<\/code> 已經一起做了：複製 <code>var<\/code>。 不用再下指令。"}, {"t": "cmd", "env": "ps152", "label": "想確認的話：只檢查，不改任何東西", "code": "cd <dzlab-installer 資料夾>\n.\\install.cmd -Stage pyDMS-clone-and-prepare -Check", "notes": ["<code>-Check<\/code>：只跑這個階段的完成檢查，唯讀。"]}]}, "b-fg": {"ch": "階段 5 · nssm-service-build", "title": "選用：先在前景試跑一次", "body": ["想親眼看啟動訊息，可以先停掉服務、手動跑一次。這是手動做法才有的選用步驟；installer 不做這一頁。不想做可以直接按下一步。"], "blocks": [{"t": "cmd", "env": "ps152", "label": "停服務、前景執行、確認埠已釋放", "code": "net stop python-dms\ncd C:\\pyDMS\n.\\.venv\\Scripts\\python.exe run.py            # 看到 [設定]、[IP]、[權限]、[SQL] 啟動訊息後按 Ctrl+C 結束\nnetstat -ano | findstr \":8000\"               # 按了 Ctrl+C 之後執行：應該沒有任何輸出", "notes": ["<code>net stop python-dms<\/code>：先停掉服務，8000 埠才空得出來。", "<code>python.exe run.py<\/code>：直接在這個視窗執行 pyDMS。看完按 Ctrl+C 結束。", "最後一行確認 8000 已經沒有程式在聽。還有的話，是 <code>run.py<\/code> 留下了子行程，下一頁會被擋住。", "如果 Windows 跳出防火牆的「允許存取」視窗，按<strong>取消<\/strong>，不要按允許。"]}], "expect": ["畫面出現 <code>[設定]<\/code>、<code>[IP]<\/code>、<code>[權限]<\/code>、<code>[SQL]<\/code> 四類啟動訊息，沒有錯誤。"], "fails": ["缺套件（<code>ModuleNotFoundError<\/code>）：<code>.venv<\/code> 沒裝好，回「建立 Python 環境」那一頁。", "8000 埠被佔用：服務沒有真的停下來，確認 <code>net stop<\/code> 成功。"], "why": [["切換到新資料夾的流程", "cf-svc-new"]], "kind": "act", "danger": "這一步會<strong>停止<\/strong> python-dms，pyDMS 會中斷，直到下一頁的安裝腳本把它重新啟動。如果試跑後決定今天不換了，執行 <code>net start python-dms<\/code> 把舊的服務開回來。", "env": "", "stage": "manual", "gate": "", "inst": null}, "b-rollback": {"ch": "收尾", "title": "記住退回的方法，舊資料夾先留著", "body": ["換好了。這一頁沒有要執行的東西，只是把退路講清楚。"], "blocks": [{"t": "list", "items": ["<strong>要退回舊資料夾<\/strong>：用記事本打開 <code>C:\\scripts\\install_pydms_service.bat<\/code>，把設定區的 <code>set \"DMS_DIR=C:\\pyDMS\"<\/code> 改回一開始記下的舊路徑，再執行一次。舊資料夾沒有被動過。installer 不會替你做這件事，它被設計成永遠不碰舊資料夾。", "<strong>退回之後不能 pull<\/strong>：舊資料夾的來源是 Gitea 的舊倉庫路徑，那個倉庫已經刪除重建，所以舊資料夾只能照原樣執行，不能更新。", "<strong>舊資料夾什麼時候處理<\/strong>：穩定運作一週之後，先備份，再刪。", "<strong>不要再用<\/strong> <code>install_services.bat<\/code> 與 <code>pythondms_installer.bat<\/code>，它們會把服務指回舊路徑。", "<strong>之後更新程式<\/strong>：<code>.env<\/code> 寫好專用帳號之後，pyDMS 會自己檢查 Gitea 有沒有新版，在系統設定的「② 更新與重啟」看得到。要手動更新時：遠端桌面進來 → <code>cd C:\\pyDMS<\/code> → <code>git -c credential.helper= pull --ff-only<\/code> → <code>C:\\nssm\\win64\\nssm.exe restart python-dms<\/code>。"]}, {"t": "alt", "title": "把 uninstall_pydms_service.bat 存起來備用", "blocks": [{"t": "file", "key": "scripts/uninstall_pydms_service.bat", "path": "C:\\scripts\\uninstall_pydms_service.bat", "note": "新腳本，還沒有在 152 上實際執行過。執行後 pyDMS 不會在背景執行，<code>/pydms/<\/code> 會回 502。", "cenv": "ps152", "ccode": "Get-Content C:\\scripts\\uninstall_pydms_service.bat -TotalCount 5 -Encoding UTF8", "cnote": "印出檔案前 5 行，確認存到了對的位置、中文沒有變成亂碼。"}, {"t": "cmd", "env": "ps152", "label": "存好後：轉成 CRLF、UTF-8 無 BOM", "code": "$f = \"C:\\scripts\\uninstall_pydms_service.bat\"\n$t = [System.IO.File]::ReadAllText($f)\n$t = $t -replace \"`r?`n\", \"`r`n\"                                          # 先把所有換行統一成 LF，再全部換成 CRLF，不會變成兩個 CR\n[System.IO.File]::WriteAllText($f, $t, (New-Object System.Text.UTF8Encoding $false))   # $false＝不加 BOM\n(Get-Content $f -Raw) -match \"`r`n\"                                       # 應該印出 True", "notes": ["<code>.bat<\/code> 用到 <code>goto<\/code> 與標籤，從網頁貼上的文字換行可能只有 LF，cmd 在某些情況下會找不到標籤，所以手動貼上的 <code>.bat<\/code> 都要轉一次。", "最後一行印出 <code>True<\/code> 才算完成。"]}]}], "expect": ["你知道退回的方法，並且沒有刪掉舊資料夾。"], "fails": [], "why": [["退回方式", "cf-svc-new"], ["審查：重要問題", "rv-major"], ["日常部署", "m-deploy"]], "kind": "info", "danger": "", "env": "", "stage": "manual", "gate": "", "inst": null}, "v-svc": {"ch": "驗收", "title": "確認三個服務活著、port 綁對位置", "body": ["有人說「連不上」的時候，也是先跑這一頁。指令都只讀取，不會改變任何東西。", "開始前請確認：這台是目前唯一使用 140.112.180.152 的機器（搬家的話，舊機已經離線）。"], "blocks": [{"t": "cmd", "env": "ps152", "label": "查詢（唯讀）", "code": "Get-Service gitea, nginx, python-dms | Select-Object Name, Status\nnetstat -ano | findstr \"LISTENING\" | findstr \":80 :443 :3000 :8000\"\nGet-Service mpssvc | Select-Object Status\nGet-NetFirewallProfile | Select-Object Name, Enabled\n$dms = ((& C:\\nssm\\win64\\nssm.exe get python-dms AppDirectory) -join '') -replace \"`0\",''\n$dms = $dms.Trim(); $dms", "notes": ["第 1 行：三個服務的狀態。第 2 行：誰在聽哪個 port。第 3、4 行：防火牆引擎與三個設定檔。", "最後兩行把 pyDMS 目前所在的資料夾存進 <code>$dms<\/code> 並印出來，後面幾頁會用到（同一個 PowerShell 視窗）。<code>-replace<\/code> 那一段是為了去掉 nssm 輸出裡多餘的字元，<span class=\"todo\">待補：待實測<\/span>；印出來的路徑不對的話，直接打 <code>$dms = \"實際路徑\"<\/code>。"]}, {"t": "fig"}], "expect": ["三個服務都是 <code>Running<\/code>。", "80、443 綁 <code>0.0.0.0<\/code>；3000、8000 綁 <code>127.0.0.1<\/code>。", "<code>mpssvc<\/code> 是 <code>Running<\/code>；三個設定檔 <code>Enabled<\/code> 都是 <code>True<\/code>。", "<code>$dms<\/code> 印出 pyDMS 的資料夾。是舊資料夾還是 <code>C:\\pyDMS<\/code> 都可以，這一頁只是記下來。"], "fails": ["某個服務不是 Running：<code>net start 服務名稱<\/code>；起不來就看 log（pyDMS 在 <code>$dms\\logs\\dms.err.log<\/code>，nginx 在 <code>C:\\nginx\\logs\\error.log<\/code>）。", "3000 或 8000 綁在 <code>0.0.0.0<\/code>：後端可以被直接連到，立刻檢查 <code>app.ini<\/code> 的 <code>HTTP_ADDR<\/code> 或 <code>.env<\/code> 的 <code>NDMS_HOST<\/code>。", "防火牆設定檔是 <code>False<\/code>：<code>netsh advfirewall set allprofiles state on<\/code>。"], "why": [["健康檢查", "m-check"], ["服務啟停", "m-svc"], ["請求怎麼走", "flow-req"], ["審查對三條路線的結論", "rv-routes"]], "kind": "ro", "danger": "", "env": "", "stage": "verify", "gate": "", "inst": [{"t": "cmd", "env": "ps152", "label": "一次跑完所有在這台上能做的檢查", "code": "cd <dzlab-installer 資料夾>\n.\\install.cmd -Action verify", "notes": ["<code>-Action verify<\/code>：嚴格唯讀。不停任何服務、不改任何設定、不做備份。", "pyDMS 在哪個資料夾，它從服務的設定讀出來，不會假設是 <code>C:\\pyDMS<\/code>。", "要在別台電腦（校內電腦、手機）做的檢查，它只會印出指令與預期結果，再問你結果是否相符。", "每一項會標 <code>OK<\/code>、<code>提醒<\/code> 或 <code>失敗<\/code>。已知的現況（例如 80 還沒有防火牆規則）會是「提醒」。"]}]}, "v-152": {"ch": "驗收", "title": "在 152 上自己連一輪", "body": ["從 152 自己發請求，確認 nginx 把每個網址都轉到對的地方。", "要用 <code>140.112.180.152<\/code>，不要用 127.0.0.1：152 自己的 IP 在白名單裡，127.0.0.1 不在。"], "blocks": [{"t": "cmd", "env": "ps152", "label": "查詢（唯讀）", "code": "curl.exe -k -s -o NUL -w \"root  %{http_code}`n\" https://140.112.180.152/              # 預期 200，導覽頁\ncurl.exe -k -s -o NUL -w \"pydms %{http_code}`n\" https://140.112.180.152/pydms/login   # 預期 200\ncurl.exe -k -s -o NUL -w \"ver   %{http_code}`n\" https://140.112.180.152/pydms/version # 預期 200\ncurl.exe -k -s -o NUL -w \"gitea %{http_code}`n\" https://140.112.180.152/gitea/        # 預期 200\ncurl.exe -s -o NUL -w \"http  %{http_code}`n\" --max-time 8 http://140.112.180.152/     # 預期 301\ncurl.exe -k -s -o NUL -w \"local %{http_code}`n\" https://127.0.0.1/                    # 預期 403（127.0.0.1 不在白名單，這是正常的）\nSelect-String -Path \"$dms\\.env\" -Pattern \"^\\s*NDMS_(HOST|PORT|URL_PREFIX|TRUST_PROXY|RELOAD|ADMIN_ALLOW_GIT)\\s*=\"", "notes": ["<code>curl.exe<\/code> 一定要寫 <code>.exe<\/code>。<code>-k<\/code> 接受自簽憑證；<code>-s -o NUL -w \"%{http_code}\"<\/code> 只印狀態碼。", "最後一行印出 <code>.env<\/code> 裡與部署有關的幾個設定（都不是機密）。<code>$dms<\/code> 是第一頁存的 pyDMS 資料夾。"]}, {"t": "alt", "title": "選用：pyDMS 內建的存取控制自我檢查", "blocks": [{"t": "cmd", "env": "ps152", "label": "執行自我檢查", "code": "cd $dms\n.\\.venv\\Scripts\\python.exe apps\\api\\validate_access_control.py", "notes": ["目前是 80 項全過。", "它會不會寫入任何東西 <span class=\"todo\">待補：待確認<\/span>，所以沒有列在唯讀檢查裡；installer 的 <code>verify<\/code> 也要加 <code>-RunAccessControlCheck<\/code> 才會跑。"]}]}], "expect": ["<code>root 200<\/code>、<code>pydms 200<\/code>、<code>ver 200<\/code>、<code>gitea 200<\/code>。", "<code>http 301<\/code>、<code>local 403<\/code>。", "<code>NDMS_HOST=127.0.0.1<\/code>、<code>NDMS_URL_PREFIX=/pydms<\/code>、<code>NDMS_TRUST_PROXY=1<\/code>；<code>NDMS_RELOAD<\/code> 不是 1。"], "fails": ["狀態碼 <code>000<\/code>：沒有連上。把 <code>-s -o NUL -w …<\/code> 拿掉改用 <code>-v<\/code> 看完整訊息。找不到 <code>curl.exe<\/code>：這台的 Windows 沒有內建，改用 Git for Windows 附的那一份（路徑 <span class=\"todo\">待補<\/span>）。", "<code>pydms 502<\/code>：python-dms 沒在跑。<code>gitea 502<\/code>：gitea 沒在跑。", "<code>/pydms/login<\/code> 回 401 或 404：網址前綴沒生效，檢查 <code>.env<\/code> 的 <code>NDMS_URL_PREFIX<\/code>。"], "why": [["第 12 步：整體驗證", "rb-12"], ["驗證指令總整理", "verify"], ["錯誤訊息怎麼判讀", "cc-errors"]], "kind": "ro", "danger": "", "env": "", "stage": "verify", "gate": "", "inst": [{"t": "tip", "k": "note", "h": "這一頁的檢查包含在 <code>.\\install.cmd -Action verify<\/code> 裡，對照它輸出的同一組結果即可。"}]}, "v-fw": {"ch": "驗收", "title": "確認防火牆只放行校內", "body": ["防火牆是第一道關卡。80 埠尤其重要：nginx 在 80 的 allow／deny 無效，80 只靠防火牆規則擋人。", "指令只讀取。"], "blocks": [{"t": "cmd", "env": "ps152", "label": "查詢（唯讀）", "code": "Get-NetFirewallRule -Direction Inbound -Enabled True | ForEach-Object {\n  $p = $_ | Get-NetFirewallPortFilter\n  if ($p.LocalPort -match '^(80|443|3000|8000|22|3389)$') {\n    [pscustomobject]@{ Name=$_.DisplayName; Port=$p.LocalPort; Action=$_.Action; Profile=$_.Profile\n                       Remote=(($_ | Get-NetFirewallAddressFilter).RemoteAddress -join ', ') }\n  }\n} | Format-Table -AutoSize -Wrap", "notes": ["列出連入規則中，port 是 80、443、3000、8000、22、3389 的那幾條，以及各自允許的來源位址。需要跑一陣子才有結果。"]}, {"t": "cmd", "env": "ps152", "label": "所有「連入、允許、來源不限」的規則（唯讀）", "code": "Get-NetFirewallRule -Direction Inbound -Enabled True -Action Allow | ForEach-Object {\n  $a = $_ | Get-NetFirewallAddressFilter\n  if ($a.RemoteAddress -contains 'Any') {\n    [pscustomobject]@{ Name=$_.DisplayName; Port=($_ | Get-NetFirewallPortFilter).LocalPort\n                       Program=($_ | Get-NetFirewallApplicationFilter).Program }\n  }\n} | Format-Table -AutoSize -Wrap", "notes": ["不篩 port。只指定程式、不指定 port 的規則也會列出來：例如有人第一次手動執行 <code>nginx.exe<\/code> 或 <code>python.exe<\/code> 時，在 Windows 跳出的視窗按了「允許存取」。", "防火牆是「任何一條允許成立就放行」。這裡如果有 <code>nginx.exe<\/code> 或 <code>python.exe<\/code> 的規則，後面把 443 收緊也沒有用。", "需要跑一陣子。"]}, {"t": "cmd", "env": "ps152", "label": "這台對外在聽哪些 port（唯讀）", "code": "Get-NetTCPConnection -State Listen | Where-Object { $_.LocalAddress -in '0.0.0.0','::' } |\n  Select-Object LocalAddress, LocalPort, OwningProcess | Sort-Object LocalPort | Format-Table -AutoSize", "notes": ["列出所有不是只綁本機的 port 與行程編號。預期看得到 80、443、3389；3000 與 8000 <strong>不應該<\/strong>出現。"]}, {"t": "table", "head": ["規則", "Port", "目前（152 現況）", "防火牆收尾後"], "rows": [["<code>Nginx HTTP (80)<\/code>", "80", "不存在（所以 80 對所有人都不通）", "來源只有校內三個網段"], ["<code>Nginx HTTPS (443)<\/code>", "443", "來源是 Any", "來源只有校內三個網段"], ["<code>Gitea-Allowed-IPs<\/code>", "3000", "啟用（已用不到）", "停用，一週後刪除"], ["<code>FastAPI-Restricted-Access<\/code>", "8000", "啟用（已用不到）", "停用，一週後刪除"], ["遠端桌面", "3389", "維持", "維持，不要動"]]}], "expect": ["80 與 443 的 Remote 只列出 <code>140.112.46.0/24<\/code>、<code>140.112.180.0/24<\/code>、<code>140.112.92.0/24<\/code>（防火牆收尾後）。", "「來源不限」的清單裡沒有 <code>nginx.exe<\/code>、<code>python.exe<\/code>，也沒有你不認得的規則。", "對外在聽的 port 裡沒有 3000 與 8000。"], "fails": ["443 的 Remote 是 <code>Any<\/code>、或沒有 80 的規則：這是 152 的已知現況。要收緊請走路線 D「防火牆收尾」。", "「來源不限」的清單裡有 <code>nginx.exe<\/code> 或 <code>python.exe<\/code>：校外可能繞過 443 的限制，請優先處理（停用那條規則）。", "3389 的來源是 <code>Any<\/code>：遠端桌面對所有來源開放。計中的邊界有沒有擋 <span class=\"todo\">待補：待確認<\/span>；要不要收斂由管理者決定，這裡不要動。"], "why": [["防火牆規則現況與目標", "cf-fw"], ["80 的 allow／deny 為什麼無效", "cc-phase"], ["三道 IP 圍籬", "cc-fences"], ["審查：重要問題", "rv-major"]], "kind": "ro", "danger": "", "env": "", "stage": "verify", "gate": "", "inst": [{"t": "tip", "k": "note", "h": "這一頁的檢查包含在 <code>.\\install.cmd -Action verify<\/code> 裡，對照它輸出的同一組結果即可。"}]}, "v-log": {"ch": "驗收", "title": "檢查 nginx 的設定、紀錄與憑證", "body": ["先確認 nginx 的設定檔沒有語法錯誤，再看它最近擋了誰。兩個指令都只讀取。"], "blocks": [{"t": "cmd", "env": "ps152", "label": "查詢（唯讀）", "code": "cd C:\\nginx\n.\\nginx.exe -t\nGet-Content C:\\nginx\\logs\\error.log -Tail 20\ncertutil -dump C:\\nginx\\ssl\\server.crt | findstr /C:\"NotAfter\" /C:\"IP Address\"\nw32tm /query /status", "notes": ["<code>.\\nginx.exe -t<\/code>：只檢查語法與憑證，不影響正在跑的 nginx。", "<code>Get-Content … -Tail 20<\/code>：錯誤紀錄最後 20 行。", "<code>certutil -dump<\/code>：憑證的到期日與裡面寫的 IP。", "<code>w32tm /query /status<\/code>：時間同步的狀態。時間不準會讓紀錄難查，也會影響兩步驟驗證。"]}], "expect": ["<code>-t<\/code> 印出 <code>syntax is ok<\/code> 與 <code>test is successful<\/code>。", "沒有新的錯誤；或只有 <code>access forbidden by rule<\/code>，後面的 IP 是校外位址。那是掃描器被擋下，屬於正常。", "憑證還沒到期。"], "fails": ["<code>access forbidden by rule<\/code> 後面是校內同仁的 IP：那個人的網段不在白名單。白名單有三處要同步，見交接書「調整白名單」。", "<code>connect() failed … 127.0.0.1:8000<\/code> 或 <code>:3000<\/code>：後端沒在跑，回「確認三個服務活著」那一頁。"], "why": [["健康檢查", "m-check"], ["Log 在哪裡", "m-log"], ["調整白名單", "m-whitelist"]], "kind": "ro", "danger": "", "env": "", "stage": "verify", "gate": "", "inst": [{"t": "tip", "k": "note", "h": "這一頁的檢查包含在 <code>.\\install.cmd -Action verify<\/code> 裡，對照它輸出的同一組結果即可。"}]}, "v-mech": {"ch": "驗收", "title": "從校內的電腦連一次", "body": ["換到機械系電腦（要有 <code>curl.exe<\/code>），確認校內用得到，而且後端的 3000、8000 不能被直接連到。"], "blocks": [{"t": "cmd", "env": "mech", "label": "在機械系電腦的 PowerShell 執行", "code": "curl.exe -k -s -o NUL -w \"pydms %{http_code}`n\" --max-time 8 https://140.112.180.152/pydms/login\ncurl.exe -k -s -o NUL -w \"gitea %{http_code}`n\" --max-time 8 https://140.112.180.152/gitea/\ncurl.exe -s -o NUL -w \"http  %{http_code}`n\" --max-time 8 http://140.112.180.152/\ncurl.exe -s -o NUL -w \"3000  %{http_code}`n\" --max-time 8 http://140.112.180.152:3000/\ncurl.exe -s -o NUL -w \"8000  %{http_code}`n\" --max-time 8 http://140.112.180.152:8000/", "notes": ["五個請求各印一個狀態碼。<code>000<\/code> 代表沒有連上。"]}, {"t": "table", "head": ["測什麼", "目前", "防火牆收尾後"], "rows": [["<code>pydms<\/code>、<code>gitea<\/code>", "200", "200"], ["<code>http<\/code>", "000（逾時）", "301"], ["<code>3000<\/code>、<code>8000<\/code>", "000（連不上）", "000（連不上）"]]}, {"t": "tip", "k": "note", "h": "交接書把預期結果分成「目前」與「防火牆收尾後」兩種。防火牆那幾步做完了，就看「收尾後」那一欄。"}, {"t": "list", "items": ["再用<strong>無痕視窗<\/strong>開 <code>https://140.112.180.152/pydms/login<\/code> 與 <code>https://140.112.180.152/gitea/<\/code>：畫面完整、樣式正常、登入後網址的前綴不會掉。"]}], "expect": ["狀態碼符合上表。", "瀏覽器裡兩個頁面都完整顯示。"], "fails": ["<code>3000<\/code> 或 <code>8000<\/code> 不是 <code>000<\/code>：後端可以被直接連到。回 152 檢查 port 綁定與防火牆規則。", "全部 <code>000<\/code>：這台電腦不在三個校內網段內，或防火牆規則的網段打錯。", "頁面沒有樣式、連結少了 <code>/gitea/<\/code>：<code>ROOT_URL<\/code> 與 nginx 的 location 不一致。"], "why": [["驗證指令總整理", "verify"], ["常見問題：連不上", "faq-conn"], ["頁面怪怪的", "faq-gitea"]], "kind": "ro", "danger": "", "env": "", "stage": "verify", "gate": "", "inst": [{"t": "tip", "k": "note", "h": "這一頁的檢查包含在 <code>.\\install.cmd -Action verify<\/code> 裡，對照它輸出的同一組結果即可。"}]}, "v-phone": {"ch": "驗收", "title": "用手機的行動網路連一次", "body": ["最後確認校外的人連不到。關掉手機的 Wi-Fi，用行動網路。"], "blocks": [{"t": "list", "items": ["關掉 Wi-Fi。", "用瀏覽器依序開 <code>https://140.112.180.152/<\/code>、<code>https://140.112.180.152/gitea/<\/code>、<code>http://140.112.180.152/<\/code>。"]}, {"t": "table", "head": ["測什麼", "目前", "防火牆收尾後"], "rows": [["https", "403 Forbidden", "逾時"], ["http", "逾時", "逾時"]]}, {"t": "tip", "k": "note", "h": "交接書把預期結果分成「目前」與「防火牆收尾後」兩種。防火牆那幾步做完了，就看「收尾後」那一欄。「逾時」是防火牆直接丟掉封包；「403」是連到了 nginx 才被擋。兩個都代表進不來，但逾時比較好，外面的人連 nginx 都碰不到。"}, {"t": "tip", "k": "note", "h": "遠端桌面（3389）從校外連不連得到，這裡沒有測。有校外的電腦可以試 <code>Test-NetConnection 140.112.180.152 -Port 3389<\/code>；結果請回報管理者，不要自己改規則。"}], "expect": ["結果符合上表：看不到任何頁面內容。"], "fails": ["看得到導覽頁、登入頁或任何內容：校外可以存取。立刻回 152 檢查 443 規則的來源是不是還是 Any，以及 nginx.conf 的 allow／deny。", "防火牆收尾後仍是 403 而不是逾時：443 的規則來源還是 Any。"], "why": [["驗證指令總整理", "verify"], ["錯誤訊息怎麼判讀", "cc-errors"]], "kind": "ro", "danger": "", "env": "phone", "stage": "verify", "gate": "", "inst": [{"t": "tip", "k": "note", "h": "這一頁的檢查包含在 <code>.\\install.cmd -Action verify<\/code> 裡，對照它輸出的同一組結果即可。"}]}, "v-auth1": {"ch": "驗收：Gitea 身分驗證", "title": "測試一：沒有帳號的人能不能用 git 讀倉庫", "body": ["連得到 152 不代表就該看得到程式碼。這四個測試用來證明「沒有帳號的人真的進不來」。請在<strong>沒有登入過這個 Gitea<\/strong>、裝有 git 的校內電腦上做。"], "blocks": [{"t": "cmd", "env": "mech", "label": "在機械系電腦的 PowerShell 執行", "code": "$env:GIT_TERMINAL_PROMPT = \"0\"                                                    # 禁止 git 詢問帳密，沒有帳號就直接失敗\ngit -c credential.helper= -c http.sslVerify=false ls-remote https://140.112.180.152/gitea/DZLab/pyDMS.git\nRemove-Item Env:GIT_TERMINAL_PROMPT                                               # 還原", "notes": ["<code>ls-remote<\/code>：只列出倉庫有哪些分支與 tag，不會下載內容。", "<code>-c credential.helper=<\/code>：這次不使用已儲存的帳密，確保測的是「匿名」。", "第三行把第一行的設定還原，記得執行。"]}, {"t": "table", "head": ["看到什麼", "意思"], "rows": [["<code>terminal prompts disabled<\/code>、<code>could not read Username<\/code> 或 <code>Authentication failed<\/code>", "需要登入，<strong>通過<\/strong>"], ["<code>repository not found<\/code>（404）", "對匿名者隱藏了這個倉庫，<strong>通過<\/strong>"], ["印出一串 commit 編號與分支名稱", "匿名可以讀，<strong>沒通過<\/strong>"]]}], "expect": ["看到上表前兩種訊息之一。"], "fails": ["匿名讀得到：檢查倉庫的可見性（是否公開）、<code>app.ini<\/code> 的 <code>REQUIRE_SIGNIN_VIEW<\/code> 與 <code>DISABLE_REGISTRATION<\/code>。依目前的 <code>app.ini<\/code>，後兩項都是 false（開放）；要不要改還沒決定，由管理者決定。", "<code>DZLab/pyDMS<\/code> 目前是公開還是私有 <span class=\"todo\">待補<\/span>。"], "why": [["身分驗證：有連結不等於能存取", "gg-auth"], ["權限怎麼看", "gg-perm"]], "kind": "ro", "danger": "", "env": "", "stage": "verify", "gate": "", "inst": [{"t": "tip", "k": "note", "h": "這一頁的檢查包含在 <code>.\\install.cmd -Action verify<\/code> 裡，對照它輸出的同一組結果即可。"}]}, "v-auth23": {"ch": "驗收：Gitea 身分驗證", "title": "測試二、三：無痕視窗看得到程式碼嗎？能自己註冊嗎？", "body": ["用瀏覽器的無痕視窗，確認沒登入的人看不到倉庫，也不能自己建帳號。"], "blocks": [{"t": "list", "items": ["<strong>測試二<\/strong>：無痕視窗開 <code>https://140.112.180.152/gitea/DZLab/pyDMS<\/code>。預期是登入頁，或 404。", "<strong>測試三<\/strong>：無痕視窗開 <code>https://140.112.180.152/gitea/user/sign_up<\/code>。預期是「註冊已關閉」的訊息，或被導向登入頁。<strong>只看，不要真的送出註冊。<\/strong>"]}], "expect": ["測試二：登入頁或 404。", "測試三：註冊已關閉，或被導向登入頁。"], "fails": ["測試二直接看到程式碼：匿名可讀，倉庫是公開的，或 <code>REQUIRE_SIGNIN_VIEW<\/code> 是 false。", "測試三看到註冊表單：白名單網段內任何人都能自己建帳號（<code>DISABLE_REGISTRATION = false<\/code>，這是 152 的現況）。要不要關由管理者決定，改法在交接書。"], "why": [["身分驗證：三個設定", "gg-auth"]], "kind": "ro", "danger": "", "env": "browser", "stage": "verify", "gate": "", "inst": [{"t": "tip", "k": "note", "h": "這一頁的檢查包含在 <code>.\\install.cmd -Action verify<\/code> 裡，對照它輸出的同一組結果即可。"}]}, "v-auth4": {"ch": "驗收：Gitea 身分驗證", "title": "測試四：錯的 token 會被拒絕，對的 token 讀得到", "body": ["最後證明伺服器真的在檢查帳密，不是來者不拒。"], "blocks": [{"t": "cmd", "env": "mech", "label": "錯的 token（nobody:wrongtoken 是亂編的假值）", "code": "$env:GIT_TERMINAL_PROMPT = \"0\"\ngit -c credential.helper= -c http.sslVerify=false ls-remote https://nobody:wrongtoken@140.112.180.152/gitea/DZLab/pyDMS.git\nRemove-Item Env:GIT_TERMINAL_PROMPT", "notes": ["和測試一相同，只是網址裡放了一組假的帳號與 token。"]}, {"t": "cmd", "env": "mech", "label": "對的 token（把 <你的帳號> 換掉；問密碼時貼上你的 token）", "code": "git -c credential.helper= -c http.sslVerify=false ls-remote https://<你的帳號>@140.112.180.152/gitea/DZLab/pyDMS.git", "notes": [ ct": ["你知道還原步驟寫在這裡，以及交接書的「還原演練」。"], "fails": [], "why": [["還原演練", "m-backup"]], "kind": "info", "danger": "還原會用備份<strong>覆蓋<\/strong>現有的資料，<code>/MIR<\/code> 還會刪掉目的地多出來的檔案。動手前先把現在的狀態（即使是壞的）另外複製一份，並再三確認來源與目的沒有寫反。", "env": "", "stage": "manual", "gate": "", "inst": null}, "e-sched": {"ch": "備份", "title": "選用：讓它每天自動備份", "body": ["手動跑成功過一次之後，才設定排程。<span class=\"dflt\">預設決定（可改）<\/span> 是不建立排程，由你決定要不要開。"], "blocks": [{"t": "cmd", "env": "cmd152", "label": "手動建立排程（把 <…> 換掉）", "code": "schtasks /Create /TN \"152-backup\" /TR \"\\\"<dzlab-installer 資料夾>\\install.cmd\\\" -Action backup-machine -Unattended\" /SC DAILY /ST 02:00 /RU SYSTEM /RL HIGHEST\nschtasks /Query /TN \"152-backup\" /V /FO LIST", "notes": ["<code>/TN<\/code> 工作名稱；<code>/TR<\/code> 要執行的程式；<code>/SC DAILY /ST 02:00<\/code> 每天凌晨兩點；<code>/RU SYSTEM<\/code> 用系統帳號；<code>/RL HIGHEST<\/code> 最高權限。", "第二行（唯讀）印出這個工作的設定。", "尚未在 152 設定過，<span class=\"todo\">待補：待實測<\/span>。"]}], "expect": ["隔天早上：備份位置多了一份新的備份集，而且 Gitea 是 <code>Running<\/code>。"], "fails": ["隔天沒有新的備份：到 installer 的紀錄資料夾 <code>C:\\ProgramData\\dzlab-installer\\logs<\/code> 看最新的紀錄。", "要取消：<code>schtasks /Delete /TN \"152-backup\"<\/code>。"], "why": [["排程", "m-backup"]], "kind": "act", "danger": "", "env": "", "stage": "backup-machine", "gate": "", "inst": [{"t": "cmd", "env": "ps152", "label": "用 installer 建立每天凌晨兩點的排程", "code": "cd <dzlab-installer 資料夾>\n.\\install.cmd -Action backup-machine -BackupRoot <備份位置> -RegisterSchedule -At 02:00", "notes": ["<code>-RegisterSchedule -At 02:00<\/code>：建立一個以系統帳號執行的每日工作。<span class=\"todo\">待補：待實測<\/span>。", "系統帳號能不能寫進 NAS，取決於 NAS 的權限，需要實測。"]}]}, "a-cutover": {"ch": "開始前", "title": "先決定怎麼切換：停機切換", "body": ["新機要沿用 140.112.180.152。同一個 IP 不能同時在兩台機器上，所以舊機必須先離線，新機才能接手。", "<span class=\"dflt\">預設決定（可改）<\/span> 採用<strong>停機切換<\/strong>：做法最單純，備份之後不會再有新的寫入遺失。代價是從舊機離線到新機驗收完成，這段時間服務是停的。"], "blocks": [{"t": "list", "items": ["公告維護時段。", "舊機：做最後一次備份，做完<strong>不把服務開回來<\/strong>。", "舊機離線（拔網路線或關機）。", "新機：設成 140.112.180.152，依序做五個階段。", "驗收。"]}, {"t": "tip", "k": "ok", "h": "退路：驗收不過，就把新機離線，舊機接回網路並把服務開回來，一切回到切換前。所以驗收完成之前，舊機不要動、不要重灌。"}, {"t": "tip", "k": "note", "h": "另外兩種做法（先用暫時 IP 建好再切換、同一台硬體重灌）各有代價，寫在交接書。要改用別的做法，請先和負責人決定。"}], "expect": ["維護時段已經公告，而且你知道退路是什麼。"], "fails": [], "why": [["審查：A 路線的切換問題", "rv-major"], ["搬家順序", "mg-order"], ["IP 變了怎麼辦", "mg-ip"]], "kind": "info", "danger": "", "env": "", "stage": "manual", "gate": "", "inst": null}, "a-ip": {"ch": "切換", "title": "舊機離線，新機接手 140.112.180.152", "body": ["從這一頁開始到驗收完成，服務是停的。"], "blocks": [{"t": "list", "items": ["確認備份集所在的磁碟或 NAS，新機讀得到。", "舊機：拔掉網路線，或關機。<strong>不要重灌、不要刪資料。<\/strong>", "新機：把 IP 設成 140.112.180.152（向系網管申請或沿用；設定方式 <span class=\"todo\">待補<\/span>）。", "從機械系電腦用遠端桌面連到 140.112.180.152，確認連到的是新機。"]}, {"t": "cmd", "env": "ps152", "label": "在新機確認（唯讀）", "code": "hostname\nipconfig | findstr \"IPv4\"", "notes": ["第一行印出這台的電腦名稱，確認不是舊機。第二行印出這台的 IP。"]}], "expect": ["<code>ipconfig<\/code> 顯示 <code>140.112.180.152<\/code>，而且電腦名稱是新機的。"], "fails": ["遠端桌面連不上：IP 還沒生效或衝突（舊機還在線上）。先確認舊機真的離線。", "連到的是舊機：舊機沒有離線。"], "why": [["審查：A 路線的切換問題", "rv-major"], ["搬家順序", "mg-order"]], "kind": "act", "danger": "舊機離線後，所有人都連不到 Gitea 與 pyDMS。退路：新機離線，舊機接回網路，在舊機執行 <code>net start gitea<\/code> 與 <code>net start python-dms<\/code>。", "env": "", "stage": "manual", "gate": "", "inst": null}, "a-gitea-svc": {"ch": "階段 3 · gitea-clone-and-deploy", "title": "把 Gitea 註冊成服務並啟動", "body": ["讓 Gitea 開機自動啟動。Gitea 用 Windows 內建的 <code>sc.exe<\/code> 註冊，和 152 現況相同。"], "blocks": [{"t": "cmd", "env": "cmd152", "label": "註冊並啟動（在 cmd 執行，不是 PowerShell）", "code": "sc create gitea binPath= \"\\\"C:\\gitea\\gitea.exe\\\" web --config \\\"C:\\gitea\\custom\\conf\\app.ini\\\"\" start= auto DisplayName= \"Gitea Git Server\"\nnet start gitea", "notes": ["<code>sc create<\/code>：建立一個 Windows 服務。<code>binPath=<\/code> 是啟動指令；<code>start= auto<\/code> 開機自動啟動。等號後面的空格是 <code>sc<\/code> 的語法，不能省。", "這行的引號寫法只適用 cmd；在 PowerShell 裡要另外跳脫，所以請用 cmd。", "<code>net start gitea<\/code>：啟動服務。"]}, {"t": "cmd", "env": "ps152", "label": "確認（唯讀）", "code": "Get-Service gitea | Select-Object Name, Status, StartType\nnetstat -ano | findstr \"LISTENING\" | findstr \":3000\"\nGet-CimInstance Win32_Service -Filter \"Name='gitea'\" | Select-Object Name, StartName", "notes": ["第二行看 3000 綁在哪個位址。第三行看服務用哪個帳號執行。"]}, {"t": "alt", "title": "選用：Gitea 當掉時自動重啟", "blocks": [{"t": "cmd", "env": "cmd152", "label": "設定失敗後重啟", "code": "sc failure gitea reset= 86400 actions= restart/5000/restart/5000/restart/60000", "notes": ["服務異常結束時，5 秒後重啟；連續失敗第三次改等 60 秒。<span class=\"todo\">待補：待實測<\/span>。installer <span class=\"dflt\">預設決定（可改）<\/span> 會做這件事。"]}]}], "expect": ["<code>gitea<\/code> 是 <code>Running<\/code>、<code>Automatic<\/code>。", "3000 綁在 <code>127.0.0.1<\/code>，不是 <code>0.0.0.0<\/code>。", "StartName 是 <code>LocalSystem<\/code>。"], "fails": ["3000 綁在 <code>0.0.0.0<\/code>：<code>app.ini<\/code> 的 <code>HTTP_ADDR<\/code> 不對。<code>net stop gitea<\/code> 後改好再啟動。", "服務啟動失敗：<code>app.ini<\/code> 的 <code>[log] MODE<\/code> 是 <code>console<\/code> 時沒有紀錄檔，先看 Windows 的事件檢視器。", "「指定的服務已經存在」：之前建立過。用 <code>sc qc gitea<\/code> 看它的設定對不對。"], "why": [["服務註冊說明", "cf-svc"], ["第 9 步：註冊服務", "rb-9"], ["三道 IP 圍籬", "cc-fences"]], "kind": "act", "danger": "", "env": "", "stage": "gitea-clone-and-deploy", "gate": "", "inst": [{"t": "tip", "k": "note", "h": "這一頁的事，installer 在 <code>gitea-clone-and-deploy<\/code> 已經一起做了：註冊服務 <code>gitea<\/code>、啟動，並確認 3000 只綁 127.0.0.1。 不用再下指令。"}, {"t": "cmd", "env": "ps152", "label": "想確認的話：只檢查，不改任何東西", "code": "cd <dzlab-installer 資料夾>\n.\\install.cmd -Stage gitea-clone-and-deploy -Check", "notes": ["<code>-Check<\/code>：只跑這個階段的完成檢查，唯讀。"]}]}, "a-fwq": {"ch": "階段 4 · nginx-deploy-and-run", "title": "先看現在有哪些防火牆規則", "body": ["Windows 防火牆決定誰連得到這台機器。先看清楚現況，下一頁才知道要「新增」還是「修改」。", "指令只讀取。"], "blocks": [{"t": "cmd", "env": "ps152", "label": "查詢（唯讀）", "code": "Get-NetFirewallRule -Direction Inbound -Enabled True | ForEach-Object {\n  $p = $_ | Get-NetFirewallPortFilter\n  if ($p.LocalPort -match '^(80|443|3000|8000|22|3389)$') {\n    [pscustomobject]@{ Name=$_.DisplayName; Port=$p.LocalPort; Action=$_.Action; Profile=$_.Profile\n                       Remote=(($_ | Get-NetFirewallAddressFilter).RemoteAddress -join ', ') }\n  }\n} | Format-Table -AutoSize -Wrap", "notes": ["列出連入規則中，port 是 80、443、3000、8000、22、3389 的那幾條，以及各自允許的來源位址。", "需要跑一陣子才有結果。"]}, {"t": "cmd", "env": "ps152", "label": "所有「連入、允許、來源不限」的規則（唯讀）", "code": "Get-NetFirewallRule -Direction Inbound -Enabled True -Action Allow | ForEach-Object {\n  $a = $_ | Get-NetFirewallAddressFilter\n  if ($a.RemoteAddress -contains 'Any') {\n    [pscustomobject]@{ Name=$_.DisplayName; Port=($_ | Get-NetFirewallPortFilter).LocalPort\n                       Program=($_ | Get-NetFirewallApplicationFilter).Program }\n  }\n} | Format-Table -AutoSize -Wrap", "notes": ["不篩 port。只指定程式、不指定 port 的規則也會列出來：例如有人第一次手動執行 <code>nginx.exe<\/code> 或 <code>python.exe<\/code> 時，在 Windows 跳出的視窗按了「允許存取」。", "防火牆是「任何一條允許成立就放行」。這裡如果有 <code>nginx.exe<\/code> 或 <code>python.exe<\/code> 的規則，後面把 443 收緊也沒有用。", "需要跑一陣子。"]}, {"t": "tip", "k": "warn", "h": "接下來幾頁全程<strong>不要動 3389（遠端桌面）的規則<\/strong>，並保持遠端桌面連線不要中斷。"}], "expect": ["全新的機器：第一個查詢通常只看到 3389。", "第二個查詢沒有 <code>nginx.exe<\/code>、<code>python.exe<\/code> 的規則。"], "fails": ["第二個查詢有 <code>nginx.exe<\/code> 或 <code>python.exe<\/code>：先把那條規則停用（<code>Disable-NetFirewallRule -DisplayName \"名稱\"<\/code>），再往下。", "3389 的來源是 Any：先記下來，這一步不要動它；要不要收斂由管理者決定。"], "why": [["第 10 步：防火牆規則", "rb-10"], ["防火牆規則現況與目標", "cf-fw"], ["審查：重要問題", "rv-major"]], "kind": "ro", "danger": "", "env": "", "stage": "nginx-deploy-and-run", "gate": "gitea-clone-and-deploy", "inst": [{"t": "cmd", "env": "ps152", "label": "執行階段 4", "code": "cd <dzlab-installer 資料夾>\n.\\install.cmd -Stage nginx-deploy-and-run", "notes": ["它會：解壓 nginx → 放憑證 → 產生 <code>nginx.conf<\/code> 並用 <code>nginx -t<\/code> 測試 → 放首頁 → 建立 80 與 443 的防火牆規則 → 註冊服務 → 啟動。", "防火牆規則在啟動 nginx <strong>之前<\/strong>建立，所以 nginx 一開始聽 port，放行範圍就已經是校內。", "如果發現「程式是 nginx.exe 或 python.ex
