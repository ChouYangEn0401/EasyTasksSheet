        # ===== EasyTasksSheet（/easytasks/ → 127.0.0.1:8100）=====
        # 放在 C:\nginx\conf\nginx.conf 的「443 server 區塊」裡，與 location /pydms/、/gitea/ 並列。
        # 443 區塊開頭的 allow/deny（三個校內網段）同樣套用到這裡，不需要另外寫。

        location = /easytasks {                     # 少打結尾斜線時補上
            return 301 /easytasks/;
        }
        location /easytasks/ {
            proxy_pass http://127.0.0.1:8100/;      # 結尾「加」斜線：去掉 /easytasks 前綴再轉發（後端兩種都接受）
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;   # 覆寫，不保留使用者自己送的值
            proxy_set_header X-Forwarded-Proto https;
            # 即時更新用 SSE（/easytasks/api/events）：不緩衝、長連線不逾時
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            # 附件上傳：影片上限 200 MB（http 區塊已是 256m，這裡寫明以免日後被調小）
            client_max_body_size 256m;
        }
