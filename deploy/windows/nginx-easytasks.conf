# EasyTasksSheet 的 nginx 設定片段（152 server：C:\nginx\conf\nginx.conf）
# 貼在「443 的 server 區塊」裡、error_page 那行之前，和 location /pydms/、/gitea/ 並列。
# 443 區塊開頭的 allow/deny（三個校內網段）同樣套用到這裡，不用另外寫。
# 貼上後：cd /d C:\nginx → nginx.exe -t → 看到 test is successful 才 nginx.exe -s reload

        # --- EasyTasksSheet ---
        # 注意:proxy_pass結尾「要」加斜線,nginx會把/easytasks/這段前綴剝掉(同Gitea做法)
        # EasyTasksSheet靠 .env 的 BASE_PATH=/easytasks 自己補回網址與cookie路徑
        # 後端只聽 127.0.0.1:8100(NSSM服務 easytasks),防火牆不用開8100
        location = /easytasks {
            return 301 /easytasks/;
        }
        location /easytasks/ {
            proxy_pass http://127.0.0.1:8100/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            # 即時更新(SSE)不能被nginx緩衝,長連線不逾時
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }
