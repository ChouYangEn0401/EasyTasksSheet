# C:\nginx\conf\nginx.conf（152 server）
# 依據：152 交接書 6.1「目前生效版本」。和那份相比，只在 443 區塊多了 EasyTasksSheet 的兩個 location
# （標示「EasyTasksSheet 新增」）；pyDMS、Gitea、80 轉址都沒有改。
# 套用：deploy\windows\apply_nginx.bat（會先備份、比對、nginx -t，失敗自動還原）。
# 存檔：UTF-8 無 BOM。

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    charset utf-8;
    client_max_body_size 256m;
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # ===== 80：把 http 轉到 https =====
    server {
        listen       80;
        server_name  140.112.180.152;
        allow 140.112.46.0/24;
        allow 140.112.180.0/24;
        allow 140.112.92.0/24;
        deny all;
        return 301 https://$host$request_uri;
    }

    # ===== 443：校內限定、TLS、依路徑分流 =====
    server {
        listen       443 ssl;
        server_name  140.112.180.152;
        allow 140.112.46.0/24;
        allow 140.112.180.0/24;
        allow 140.112.92.0/24;
        deny all;

        ssl_certificate      C:/nginx/ssl/server.crt;
        ssl_certificate_key  C:/nginx/ssl/server.key;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers  on;

        # 首頁導覽頁
        location = / {
            root   html;
            try_files /jump_page.html =404;
        }

        # pyDMS（未改）
        location /pydms/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Gitea（未改）
        location /gitea/ {
            proxy_pass http://127.0.0.1:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ===== EasyTasksSheet 新增：/easytasks/ → 127.0.0.1:8100 =====
        location = /easytasks {                     # 少打結尾斜線時補上
            return 301 /easytasks/;
        }
        location /easytasks/ {
            proxy_pass http://127.0.0.1:8100/;      # 結尾加斜線：去掉 /easytasks 前綴再轉發
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;   # 覆寫，不保留使用者自己送的值
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;                    # 即時更新（SSE）不緩衝
            proxy_cache off;
            proxy_read_timeout 1h;                  # SSE 長連線不逾時
            client_max_body_size 256m;              # 附件上傳（影片上限 200 MB）
        }
        # ===== EasyTasksSheet 新增結束 =====

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
